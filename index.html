// 外で作った絵（Codex など）に差し替えるときは「ポーズ記号: 画像の場所」を書く。
// 右手の絵を用意すれば、左手は左右反転して使う。 例: g:'hands/g.png'
const HAND_IMAGES={};
const FINGERS=[
  {cx:73, w:25,len:84,a:-9},   // 人差し指
  {cx:99, w:26,len:95,a:-2},   // 中指
  {cx:124,w:25,len:87,a:5},    // 薬指
  {cx:147,w:21,len:66,a:13}    // 小指
];
const THUMB={
  out :{x:64,y:192,len:74,a:-40,nail:true},
  in  :{x:64,y:202,len:46,a:-14},
  fist:{x:62,y:206,len:58,a:-20},
  fox :{x:62,y:204,len:52,a:-6},
  up  :{x:60,y:150,len:80,a:-4,nail:true}
};
function handArt(key,side){
  const P=HAND_POSES[key];
  if(HAND_IMAGES[key]) return `<img class="hand-img${side==='L'?' mir':''}" src="${HAND_IMAGES[key]}" alt="">`;
  const body=[], deco=[];
  const cap=(x,y,len,w,a)=>`<rect x="${x-w/2}" y="${y-len}" width="${w}" height="${len+w}" rx="${w/2}" transform="rotate(${a} ${x} ${y})"/>`;
  const nail=(x,y,len,w,a)=>`<rect x="${x-w*0.28}" y="${y-len+w*0.18}" width="${w*0.56}" height="${w*0.66}" rx="${w*0.24}" transform="rotate(${a} ${x} ${y})"/>`;
  const T=THUMB[P.t];
  if(T){ body.push(cap(T.x,T.y,T.len,27,T.a)); if(T.nail) deco.push(nail(T.x,T.y,T.len,27,T.a)); }
  FINGERS.forEach((F,i)=>{
    if(P.f[i]===1){ body.push(cap(F.cx,132,F.len,F.w,F.a)); deco.push(nail(F.cx,132,F.len,F.w,F.a)); }
    else if(P.f[i]===0){
      body.push(cap(F.cx,132,22,F.w,F.a*0.4));
      deco.push(`<path d="M${F.cx-F.w*0.26} 118 q${F.w*0.26} -5 ${F.w*0.52} 0" class="cr" transform="rotate(${F.a*0.4} ${F.cx} 132)"/>`);
    }
  });
  if(P.ring){   // 親指と人差し指の輪（OK）
    const cx=64,cy=100,R=25,r=10;
    body.push(`<path fill-rule="evenodd" d="M${cx-R} ${cy}a${R} ${R} 0 1 0 ${2*R} 0a${R} ${R} 0 1 0 ${-2*R} 0Z M${cx-r} ${cy}a${r} ${r} 0 1 0 ${2*r} 0a${r} ${r} 0 1 0 ${-2*r} 0Z"/>`);
    body.push(cap(66,150,30,26,-10));
  }
  body.push(`<path d="M58 132 Q57 120 70 119 L150 121 Q160 123 159 136 L155 196 Q152 226 130 232 L132 252 L78 252 L80 232 Q58 224 57 196 Z"/>`);
  const shapes=body.join('');
  const inner=`<g class="hs">${shapes}</g><g class="hf">${shapes}</g><g class="hn">${deco.join('')}</g>`;
  return `<svg class="hand" viewBox="0 0 210 256">${side==='L'?`<g transform="translate(210 0) scale(-1 1)">${inner}</g>`:inner}</svg>`;
}
const HAND_SPEED={fast:[1.5,3], mid:[2,4], slow:[3,5]};
const HAND_SPEED_JP={fast:'1.5〜3秒', mid:'2〜4秒', slow:'3〜5秒'};
const handPool=set=>Object.keys(HAND_POSES).filter(k=>set==='all'||HAND_POSES[k].num);

/* ============================================================
   HANDS engine — copy the left / right hand shapes at once
   ============================================================ */
let H=null;
function stopHands(){ if(H){ H.stops.forEach(f=>f&&f()); clearTimeout(H.next); clearInterval(H.clock); H=null; } }
function runHands(cfg){
  stopAll();
  if(cfg.beep) audioOn();
  H={cfg, pool:handPool(cfg.set), set:1, count:0, L:null, R:null, stops:[]};
  $('hSetLbl').textContent='セット';
  $('hSet').textContent=`1/${cfg.sets}`;
  $('hCount').textContent='0';
  $('hField').classList.toggle('named',!!cfg.names);
  $('hL').innerHTML=''; $('hR').innerHTML=''; $('hLn').textContent=''; $('hRn').textContent='';
  show('playHands','左右の手まね', `${cfg.show==='num'?'数字で出す':cfg.show==='mix'?'絵と数字':'イラスト'} ・ ${cfg.set==='all'?'いろんなポーズ':'数字の形だけ'} ・ ${HAND_SPEED_JP[cfg.spd]}`);
  handsSet(true);
}
// 絵で出すか、数字で出すか（数字以外のポーズは名前を文字で出す）
function handFace(key,side,show){
  const asNum = show==='num' || (show==='mix' && Math.random()<0.5);
  if(!asNum) return handArt(key,side);
  const P=HAND_POSES[key];
  return P.d!=null ? `<div class="hnum tnum">${P.d}</div>` : `<div class="hnum word">${P.n}</div>`;
}
function handsRuleInfo(cfg){
  const pool=handPool(cfg.set);
  const num=cfg.show==='num';
  const face=(k,sd)=>num?`<div class="hnum tnum" style="font-size:64px">${HAND_POSES[k].d}</div>`:handArt(k,sd);
  const ex=`<div class="prep-ex hands-ex"><div><div class="hl">左手</div>${face(num?'p5':'p2','L')}</div><div><div class="hl">右手</div>${face(num?'p1':'p4','R')}</div></div>`
    +(num?`<div class="prep-s">左 5 → パー、右 1 → 人差し指。0 はグーです。</div>`:'');
  return {
    title:'左右の手をまねする',
    sub:`${num?'左右に出た数字の形':cfg.show==='mix'?'絵か数字で出た形':'左手と右手の絵と同じ形'}を、すぐに自分の両手で作ります。形は ${HAND_SPEED_JP[cfg.spd]} ごとに変わります（${pool.length}種類）。`,
    ex
  };
}
function handsSet(first){
  const c=H.cfg;
  $('hSet').textContent=`${H.set}/${c.sets}`;
  $('hClock').textContent=c.dur;
  const begin=()=>{
    if(!H) return;
    let left=c.dur; $('hClock').textContent=left;
    H.clock=setInterval(()=>{
      left--; $('hClock').textContent=Math.max(0,left);
      if(left<=0){ clearInterval(H.clock); clearTimeout(H.next); handsEnd(); }
    },1000);
    handsNext();
  };
  H.stops.push(first
    ? veilPrepare($('hVeil'), handsRuleInfo(c), begin)
    : veilCountdown($('hVeil'), '左右の手をまねする', begin));
}
function handsNext(){
  if(!H) return;
  const p=H.pool; let L,R,n=0;
  do{ L=p[rnd(p.length)]; R=p[rnd(p.length)]; n++; }
  while((L===R || (L===H.L && R===H.R)) && n<100);
  const chL=L!==H.L, chR=R!==H.R;
  H.L=L; H.R=R; H.count++;
  $('hCount').textContent=H.count;
  const put=(side,key,changed)=>{
    const box=$('h'+side), nm=$('h'+side+'n');

    if(changed){ box.classList.remove('pop'); void box.offsetWidth; box.classList.add('pop'); }
  };
  put('L',L,chL); put('R',R,chR);
  if(H.cfg.beep){ const t=now()+0.01; tone(t,1040,0.09,0.4); }
  const [a,b]=HAND_SPEED[H.cfg.spd];
  H.next=setTimeout(handsNext, Math.round((a+Math.random()*(b-a))*1000));
}
function handsEnd(){
  if(H.set>=H.cfg.sets) return handsDone();
  H.stops.push(veilRest($('hVeil'),15,()=>{ if(H){ H.set++; handsSet(false); } }));
}
function handsDone(){
  const c=H.cfg, n=H.count; stopHands();
  if(PROG && progAdvance({count:n})) return;
  finish({
    type:'hands', cfg:c, title:'完了', note:'おつかれさまでした',

// おまかせ：数字・ゆっくり → 数字・ふつう → いろいろ・ふつう → いろいろ・はやい
function buildHandsProgram(){

/* ============================================================
   BREATH engine — 吐く → 止める → 吸う をくり返す呼吸タイマー
   ============================================================ */
const BREATH_STEPS=[
  {k:'out', n:'吐く',   say:'吐きます'},
  {k:'hold',n:'止める', say:'止めます'},
  {k:'in',  n:'吸う',   say:'吸います'}
];
const breathPat=c=>`${c.out}-${c.hold}-${c.in}`;
// 声の数え方：up=最後まで数える／last3=残り3秒だけ「さん・に・いち」／off=数えない（古い設定も読む）
const breathCount=c=>({up:'up',last3:'last3',off:'off',voice:'up'})[c.count]||'last3';
const breathSnd=c=>(c.count==='none'||c.tick===false)?'none':(c.snd||'clock');
function breathCountTxt(c){
  const md=breathCount(c), sn=breathSnd(c);
  const tick = sn==='none' ? '' : `（数えない秒は${BEAT_KINDS[sn]}の音）`;
  return md==='up' ? '各段は「いち・に・さん…」と最後の秒まで声で数えます。'
       : md==='last3' ? `各段の残り3秒を「さん・に・いち」と数えます${tick}。`
       : `声では数えません${tick}。`;
}
const numTxt=n=>KANA_NUM[n]||String(n);
// 時計の針のような「カチ」（ノイズを細い帯域に絞った短い音）
let NOISE=null;
function clockTick(t,alt){
  if(!AU.ctx||!AU.out) return;
  const c=AU.ctx;
  if(!NOISE){ NOISE=c.createBuffer(1,Math.round(c.sampleRate*0.05),c.sampleRate); const d=NOISE.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; }
  const s=c.createBufferSource(), f=c.createBiquadFilter(), g=c.createGain();
  s.buffer=NOISE; f.type='bandpass'; f.frequency.value=alt?2600:3400; f.Q.value=6;
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.9,t+0.002); g.gain.exponentialRampToValueAtTime(0.0001,t+0.035);
  s.connect(f); f.connect(g); g.connect(AU.out); s.start(t); s.stop(t+0.05);
}

// カウント／メトロノームの音の種類（設定で選ぶ）。accent=1周の頭など強い拍
const BEAT_KINDS={clock:'時計',wood:'木の音',beep:'電子音',soft:'やさしい',click:'クリック'};
function beatSound(kind,t,alt,accent){
  switch(kind){
    case 'none' : break;
    case 'clock': clockTick(t,alt&&!accent); if(accent) tone(t,2400,0.04,0.3,'triangle'); break;
    case 'wood' : tone(t,accent?1250:880,0.07,0.55,'triangle'); tone(t,(accent?1250:880)*2.7,0.025,0.18); break;
    case 'beep' : tone(t,accent?1500:1000,0.07,0.45); break;
    case 'soft' : tone(t,accent?660:500,0.18,0.4); break;
    default     : (accent?SND.accent:SND.click)(t);
  }
}
// 設定で音を選んだときに、その場で試しに鳴らす
function beatPreview(kind){ if(kind==='none') return; audioOn(); const t=now()+0.03; beatSound(kind,t,false,true); beatSound(kind,t+0.45,false,false); beatSound(kind,t+0.9,true,false); }

let B=null;
function stopBreath(){
  if(!B) return;
  B.timers.forEach(clearTimeout); clearInterval(B.clock);
  audioCut(false); sayStop(); wakeOff();
  B=null;
}
function bLater(fn,ms){
  const b=B; const id=setTimeout(()=>{ if(B===b && !b.over) fn(); },Math.max(0,ms));
  b.timers.push(id); if(b.timers.length>300) b.timers.splice(0,150);
}
const bAt=(t,fn)=>bLater(fn,(t-now())*1000);
const fmtClock=s=>{ s=Math.max(0,Math.ceil(s)); return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; };

function runBreath(cfg){
  stopAll();
  const steps=BREATH_STEPS.map(s=>({...s,d:cfg[s.k]})).filter(s=>s.d>0);
  B={cfg, steps, timers:[], clock:null, cycles:0, t0:0, total:cfg.min*60, over:false, started:false, busyUntil:0, minSaid:0};
  $('bLeft').textContent=fmtClock(B.total);
  $('bPatLbl').textContent=breathPat(cfg);
  $('bCycles').textContent='0';
  $('bPhase').textContent=''; $('bNum').textContent=''; $('bNext').textContent='';
  const bub=$('bBub'); bub.style.transition='none'; bub.style.transform='scale(1)'; bub.className='bub';
  $('bStop').style.display='none';
  show('playBreath','呼吸調整',`${breathPat(cfg)} ・ ${cfg.min}分`);
  const rows=steps.map(s=>`<div class="prep-li"><span>${s.n}</span><span class="act">${s.d}秒</span></div>`).join('');
  veilShow($('bVeil'),`<div class="prep">
      <div class="prep-k">ルール</div>
      <div class="prep-t">${breathPat(cfg)} の呼吸を ${cfg.min}分</div>
      <div class="prep-s">はじまりに「吐きます・止めます・吸います」と声で知らせます。${breathCountTxt(cfg)}${cfg.minute===false?'':'1分ごとに「◯分経過」、最後の2分は「残り◯分です」とお知らせします。'}</div>
      <div class="prep-list">${rows}</div>
      <div class="prep-s">苦しくなったら無理をせず、ふつうの呼吸に戻してください。</div>
      <button class="btn prep-b" id="bGo">はじめる</button>
    </div>`);
  $('bGo').onclick=()=>{
    if(!B) return;
    audioOn(); say('はじめます',true); wakeOn();      // unlock sound & voice inside the tap
    let n=3;
    veilShow($('bVeil'),`<div class="lab">楽な姿勢で</div><div class="big tnum" id="bCd">${n}</div><div class="lab">最初は「吐く」から</div>`);
    const step=()=>{
      if(n<=0){ veilHide($('bVeil')); bStart(); return; }
      const e=$('bCd'); if(e) e.textContent=n; SND.count(now()+0.01); n--;
      bLater(step,1000);
    };
    bLater(step,900);
  };
}
function bStart(){
  const T=now()+0.15;
  B.t0=T; B.started=true;
  $('bStop').style.display='block';
  B.clock=setInterval(()=>{
    if(!B||B.over) return;
    const left=B.total-(now()-B.t0);
    $('bLeft').textContent=fmtClock(left);
    if(left<=0) $('bNext').textContent='最後の1呼吸（終わったら終了）';
  },250);
  bStep(0,T);
}
// pre＝前の段の最後の数（「じゅうご」など）、extra＝1分ごとのお知らせ。どちらも段の合図と続けて話す
function bStep(i,T,pre,extra){
  const st=B.steps[i], D=st.d, cfg=B.cfg, mode=breathCount(cfg), snd=breathSnd(cfg);
  const voiced=k=> mode==='up' ? true : mode==='last3' ? k>=Math.max(1,D-3) : false;   // k秒目を声で数えるか
  for(let k=1;k<D;k++){
    if(!voiced(k)) beatSound(snd,T+k,k%2,false);
    else if(!canSpeak()) SND.tick(T+k);              // 声が出ない端末は音で代わりに
  }
  bAt(T,()=>{
    const d=say([pre,st.say,extra].filter(Boolean).join('、'),true);
    B.busyUntil=now()+(d||0)-0.2;                     // 話しているあいだの数は、音に置きかえる
    $('bPhase').textContent=st.n; $('bNum').textContent = mode==='up' ? 0 : D;
    const bub=$('bBub');
    bub.className='bub '+st.k;
    bub.style.transition=`transform ${D}s linear`;
    if(st.k==='out') bub.style.transform='scale(.52)';
    else if(st.k==='in') bub.style.transform='scale(1)';
    const nx=B.steps[(i+1)%B.steps.length];
    if(B.total-(now()-B.t0)>0) $('bNext').textContent=`次：${nx.n}（${nx.d}秒）`;
  });
  for(let k=1;k<D;k++){
    const rem=D-k;
    bAt(T+k,()=>{
      $('bNum').textContent = mode==='up' ? k : rem;
      if(!voiced(k) || !canSpeak()) return;
      const txt=numTxt(mode==='up'?k:rem), wait=B.busyUntil-now();
      if(wait>0.6){ beatSound(snd==='none'?'soft':snd,now()+0.01,k%2,false); return; }   // 長いお知らせ中は音に
      if(wait>0){ bLater(()=>say(txt,true),wait*1000+60); return; }                     // 合図が少し長いときは、言い終わってから数える
      say(txt,true);
    });
  }
  const Tn=T+D;
  bAt(Tn-0.3,()=>{
    const last = mode==='up' ? numTxt(D) : '';        // 最後まで数えるときは、最後の秒を次の合図の前に言う
    let ni=i+1;
    if(ni>=B.steps.length){
      ni=0; B.cycles++; $('bCycles').textContent=B.cycles;
      if(Tn-B.t0>=B.total-0.5) return bEnd(Tn,false,last);   // 時間が来たら、1呼吸を終えてから終了
    }
    let ex='';
    const m=Math.floor((Tn-B.t0+0.5)/60);
    if(cfg.minute!==false && m>=1 && m>B.minSaid){
      B.minSaid=m;
      const r=cfg.min-m;
      // 「残り◯分です」は最後の2分だけ。それより前は「◯分経過」だけ言う
      ex = r>2 ? `${m}分経過` : r>0 ? `${m}分経過、残り${r}分です` : `${Math.min(m,10)}分経過、この呼吸で終わりです`;
    }
    bStep(ni,Tn,last,ex);
  });
}
function bEnd(T,early,pre){
  if(early){ audioCut(true); T=now()+0.02; }
  const secs=Math.max(0,T-B.t0);
  SND.end(T+(pre?0.5:0));
  bAt(T,()=>{
    B.over=true;
    say([pre,'おわりです。ふつうの呼吸に戻しましょう'].filter(Boolean).join('、'),true);
    $('bPhase').textContent='おわり'; $('bNum').textContent='';
    const bub=$('bBub'); bub.style.transition='transform 1.2s ease'; bub.style.transform='scale(.8)'; bub.className='bub';
    $('bNext').textContent=''; $('bStop').style.display='none';
    const b=B;
    setTimeout(()=>{ if(B===b) bDone(secs); },3200);
  });
}
$('bStop').onclick=()=>{ if(B && B.started && !B.over) bEnd(0,true); };
function bDone(secs){
  const c=B.cfg, n=B.cycles; stopBreath();
  finish({ type:'breath', cfg:c, title:'完了', note:'おつかれさまでした',
    stats:[['呼吸した時間',fmtSecs(secs)],['呼吸',n+'回'],['リズム',breathPat(c)],['設定',c.min+'分']] });
}

/* ============================================================
   MEMORY GRID engine — 数字の位置を覚えて 1 から順に押す
   ============================================================ */
const MEM_GRID={s:[4,5], m:[5,7], l:[6,9]};                    // [列, 行]
let W=null;
function stopMem(){ if(W){ W.stops.forEach(f=>f&&f()); clearTimeout(W.to); W=null; } }
function runMem(cfg){
  stopAll(); audioOn();
  W={cfg, q:0, hits:0, k:cfg.auto?4:cfg.count, best:0, times:[], log:[], stops:[], to:null,
     lock:true, pos:[], next:1, hidden:false, tHide:0};
  const [c,r]=MEM_GRID[cfg.grid];
  W.cols=c; W.rows=r;
  $('wProg').textContent=`1/${cfg.total}`; $('wCnt').textContent=W.k; $('wHits').textContent='0';
  $('wTag').textContent=''; $('wMsg').textContent='';
  show('playMem','数字の位置記憶', cfg.auto?`おまかせ 全${cfg.total}問 ・ ${cfg.after==='square'?'白い四角あり':'枠だけ'}`:`${cfg.count}個 ・ ${cfg.after==='square'?'白い四角あり':'枠だけ'}`);
  memBuild();
  W.stops.push(veilPrepare($('wVeil'), memRuleInfo(cfg), memNext));
}
function memRuleInfo(cfg){
  const sq=cfg.after==='square';
  return {
    title:'数字の場所を覚える',
    sub:`<b>1回目</b>：見えている数字を 1 から順に押して覚えます。<br><b>2回目</b>：全部押すと数字が${sq?'四角に変わります':'消えます'}。もう一度 1 から順に、場所を思い出して押します。`,
    ex:`<div class="prep-list">
        <div class="prep-li"><span>1回目</span><span class="act">見ながら押す</span></div>
        <div class="prep-li"><span>2回目・正しい場所</span><span class="act same">数字が出て次へ</span></div>
        <div class="prep-li"><span>ちがう場所</span><span class="act opp">その問題は終わり</span></div>
      </div>`
  };
}
function memBuild(){
  const g=$('wGrid'); g.innerHTML='';
  for(let i=0;i<W.cols*W.rows;i++){
    const b=document.createElement('button'); b.className='mc'; b.dataset.i=i; g.appendChild(b);
  }
  memLayout();
}
function memLayout(){
  if(!W) return;
  const g=$('wGrid'), f=$('wField');
  const gap=6, Wd=f.clientWidth-20, Ht=f.clientHeight-52;
  if(Wd<=0||Ht<=0) return;
  const cell=Math.floor(Math.min((Wd-(W.cols-1)*gap)/W.cols,(Ht-(W.rows-1)*gap)/W.rows));
  g.style.gridTemplateColumns=`repeat(${W.cols},${cell}px)`;
  g.style.gridTemplateRows=`repeat(${W.rows},${cell}px)`;
  g.style.gap=gap+'px';
  g.style.fontSize=Math.round(cell*0.6)+'px';
}
window.addEventListener('resize',()=>{ if(W) memLayout(); });
const memCell=i=>$('wGrid').children[i];
function memNext(){
  if(!W) return;
  if(W.q>=W.cfg.total) return memDone();
  W.q++;
  const n=W.cols*W.rows, k=Math.min(W.k,n);
  const cells=shuffle([...Array(n).keys()]).slice(0,k);
  W.pos=[null,...cells];                          // W.pos[数字] = マスの番号
  W.next=1; W.hidden=false; W.lock=false;
  [...$('wGrid').children].forEach(b=>{ b.className='mc'; b.textContent=''; });
  cells.forEach((ci,j)=>{ const b=memCell(ci); b.className='mc num'; b.textContent=j+1; });
  $('wProg').textContent=`${W.q}/${W.cfg.total}`; $('wCnt').textContent=k;
  $('wTag').textContent='1回目：見ながら 1 から順に押す';
  $('wMsg').textContent='全部押すと、数字が隠れます';
}
function memHide(){
  if(!W||W.hidden) return;
  clearTimeout(W.to);
  W.hidden=true; W.tHide=performance.now(); W.next=1; W.lock=false;
  for(let v=1; v<W.pos.length; v++){
    const b=memCell(W.pos[v]); b.textContent='';
    b.className = W.cfg.after==='square' ? 'mc sq' : 'mc';
  }
  $('wTag').textContent='2回目：覚えた場所を 1 から順に押す'; $('wMsg').textContent='';
}
$('wGrid').addEventListener('click',e=>{
  const b=e.target.closest('.mc'); if(!b||!W||W.lock) return;
  const i=+b.dataset.i, exp=W.pos[W.next];
  if(!W.hidden){                                   // 1回目：見ながら順に押す（まちがえても減点なし）
    if(i===exp){
      b.className='mc seen'; tone(now()+0.01, 660+W.next*30, 0.06, 0.18);
      W.next++;
      if(W.next>=W.pos.length){ W.lock=true; $('wMsg').textContent='隠します…'; W.to=setTimeout(memHide,600); }
    }else if(W.pos.indexOf(i)<0 || W.pos.indexOf(i)>W.next){
      b.classList.remove('miss'); void b.offsetWidth; b.classList.add('miss');
    }
    return;
  }
  const v=W.pos.indexOf(i);
  if(v>0 && v<W.next) return;                       // もう正解したマス
  if(W.cfg.after==='square' && v<0) return;         // 四角を残すときは、四角だけが押せる
  if(i===exp) memOk(i); else memNg(i);
});
function memOk(i){
  const b=memCell(i); b.className='mc ok'; b.textContent=W.next;
  tone(now()+0.01, 880+W.next*40, 0.08, 0.25);
  W.next++;
  if(W.next>=W.pos.length){                        // 全部正解
    W.lock=true; W.hits++;
    const t=W.hidden?(performance.now()-W.tHide)/1000:0, k=W.pos.length-1;
    W.times.push(t); W.best=Math.max(W.best,k);
    W.log.push({exp:`${k}個 ・ ${t.toFixed(1)}秒`, ok:true});
    $('wHits').textContent=W.hits; $('wTag').textContent='正解！'; $('wMsg').textContent='';
    if(W.cfg.auto) W.k=Math.min(10,W.k+1);
    W.to=setTimeout(memNext,900);
  }
}
function memNg(i){
  W.lock=true;
  const k=W.pos.length-1, got=W.next-1;
  tone(now()+0.01,200,0.25,0.3,'square');
  for(let v=W.next; v<W.pos.length; v++){ const b=memCell(W.pos[v]); b.className='mc show'; b.textContent=v; }
  const b=memCell(i); b.classList.add('ng'); if(!b.textContent) b.textContent='×';
  W.log.push({exp:`${k}個`, ok:false, ans:`${got}まで正解`});
  $('wTag').textContent='ざんねん'; $('wMsg').textContent=`正しくは、ここが ${W.next} でした`;
  memCell(W.pos[W.next]).classList.add('want');
  if(W.cfg.auto) W.k=Math.max(3,W.k-1);
  W.to=setTimeout(memNext,2000);
}
function memDone(){
  const c=W.cfg, hits=W.hits, total=c.total, times=W.times.slice(), best=W.best, log=W.log.slice();
  stopMem();
  const avg=times.length?times.reduce((a,b)=>a+b,0)/times.length:0;
  const stats=[['正解',`${hits}/${total}`],['正答率',Math.round(hits/total*100)+'%']];
  stats.push(c.auto?['いちばん多く覚えた数',best?best+'個':'—']:['数字の数',c.count+'個']);
  stats.push(['思い出す時間（平均）',times.length?avg.toFixed(1)+'秒':'—']);
  finish({ type:'mem', cfg:c, autoType:c.auto?'mem':undefined, stats, log,
    celebrate:{hits,total, title:hits===total?'パーフェクト':hits>=Math.ceil(total*0.8)?'クリア':'コンプリート',
      note:'おつかれさまでした', tier:hits===total?'perfect':hits>=Math.ceil(total*0.8)?'good':''} });
}

  C.stops.push(veilPrepare($('cVeil'),info,cardBegin));
}
function cardChangeTxt(c){
  const m={suit:'記号',num:'数字',scol:'記号の色',ncol:'数字の色'};
  return c.change.filter(k=>c.num||(k!=='num'&&k!=='ncol')).map(k=>m[k]).join('・')||'カード';
}
function cardBegin(){
  if(!C) return;
  let left=C.cfg.dur; $('cLeft').textContent=left;
  $('cCard').style.visibility='visible';
  if(flashKindOf(C.cfg)==='color'){ $('cWall').style.display='block'; $('cWallLeft').textContent=left; }
  C.clock=setInterval(()=>{ left--; $('cLeft').textContent=Math.max(0,left); $('cWallLeft').textContent=Math.max(0,left); if(left<=0) cardDone(); },1000);
  cardNext();
}
function cardRoll(prev){
  const c=C.cfg, ch=k=>!prev||c.change.includes(k);
  const st={...(prev||{})};
  if(ch('suit')) st.suit=pick(Object.keys(SUITS));
  if(ch('num'))  st.num=pick(CARD_RANGE[c.range].v);
  if(c.colorMode==='real') st.scol = SUITS[st.suit].red ? 'red' : 'black';
  else if(ch('scol')) st.scol=pick(c.colors);
  if(c.numCol==='same' || c.colorMode==='real') st.ncol=st.scol;   // 本物どおりなら数字も記号と同じ色
  else if(ch('ncol')) st.ncol=pick(c.colors);
  return st;
}
function flashNext(){
  const c=C.cfg, kind=flashKindOf(c), prev=C.cur||{};
  let st={...prev}, n=0;
  if(kind==='color'){
    do{ st.wall=pick(c.wallColors); n++; }while(c.wallColors.length>1 && st.wall===prev.wall && n<30);
    $('cWall').style.background=WALL_COLORS[st.wall].c;
    const dark=['black','blue','purple','green','red'].includes(st.wall);
    $('cWallX').style.background=$('cWall').querySelector('.fwall-hud').style.background=dark?'rgba(255,255,255,.22)':'rgba(0,0,0,.28)';
  }else{
    const vals=numOnlyValues(c.nrange), ch=k=>!C.cur||c.nchange.includes(k);
    do{
      if(ch('num')) st.n=pick(vals);
      if(ch('col')) st.col=pick(c.ncolors);
      n++;
    }while(C.cur && n<40 && st.n===prev.n && st.col===prev.col);
    const el=$('cNumOnly'); el.textContent=st.n; el.style.color=CARD_COLORS[st.col].c;
    el.classList.remove('flip'); void el.offsetWidth; el.classList.add('flip');
  }
  C.cur=st;
}
function cardNext(){
  if(!C) return;
  if(flashKindOf(C.cfg)!=='card'){
    flashNext(); C.count++;
    $('cCount').textContent=C.count; $('cWallCount').textContent=C.count;
    if(C.cfg.beep){ tone(now()+0.01,1200,0.05,0.3); }
    const c=C.cfg, iv=c.timing==='fixed'?c.iv:(()=>{ const [a,b]=CARD_RAND[c.rand]; return a+Math.random()*(b-a); })();
    C.to=setTimeout(cardNext,Math.round(iv*1000));
    return;
  }
  const prev=C.cur; let st,n=0;
  do{ st=cardRoll(prev); n++; }                     // 前のカードと見た目が同じにならないように
  while(prev && n<50 && st.suit===prev.suit && (!C.cfg.num||st.num===prev.num) && st.scol===prev.scol && (!C.cfg.num||st.ncol===prev.ncol));
  C.cur=st; C.count++;
  $('cCount').textContent=C.count;
  const card=$('cCard');
  card.innerHTML=(C.cfg.num?`<div class="cnum tnum" style="color:${CARD_COLORS[st.ncol].c}">${st.num}</div>`:'')
    +suitSvg(st.suit,CARD_COLORS[st.scol].c,'csuit'+(C.cfg.num?'':' big'));
  card.classList.remove('flip'); void card.offsetWidth; card.classList.add('flip');
  if(C.cfg.beep){ tone(now()+0.01,1200,0.05,0.3); }
  const c=C.cfg, iv=c.timing==='fixed'?c.iv:(()=>{ const [a,b]=CARD_RAND[c.rand]; return a+Math.random()*(b-a); })();
  C.to=setTimeout(cardNext,Math.round(iv*1000));
}
function cardDone(early){
  const c=C.cfg, n=C.count, kind=flashKindOf(c); stopCard();
  const what = kind==='color' ? ['色',c.wallColors.length+'色'] : kind==='num' ? ['変わったもの',c.nchange.map(x=>x==='num'?'数字':'色').join('・')] : ['変わったもの',cardChangeTxt(c)];
  finish({ type:'card', cfg:c, title:early?'途中で終了':'完了', note:'おつかれさまでした',
    stats:[[kind==='color'?'見た色':kind==='num'?'見た数字':'見たカード',n+'枚'],['種類',FLASH_KINDS[kind]],['切り替え',cardIvTxt(c)],what] });
}

/* ============================================================
   PROJECTOR — 大きく映す表示（全トレーニング共通）と、丸タッチ（壁・床に映して触る／飛び移る）
   ============================================================ */
function projPref(){ try{ return localStorage.getItem('notore-proj')==='1'; }catch(e){ return false; } }
function fullOn(){ try{ const d=document.documentElement; if(d.requestFullscreen && !document.fullscreenElement) d.requestFullscreen().catch(()=>{}); }catch(e){} }
function fullOff(){ try{ if(document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(()=>{}); }catch(e){} }
function projSet(on,fromTap){
  try{ localStorage.setItem('notore-proj',on?'1':'0'); }catch(e){}
  document.body.classList.toggle('proj',on);
  const t=$('projToggle'); if(t) t.classList.toggle('on',on);
  if(fromTap){ if(on) fullOn(); else fullOff(); }
}

const SPOT_COLORS=['red','yellow','green','blue','white','orange','purple','pink','sky'];   // 黒は映らないので使わない
const SPOT_SAY={red:'あか',yellow:'きいろ',green:'みどり',blue:'あお',white:'しろ',orange:'オレンジ',purple:'むらさき',pink:'ピンク',sky:'みずいろ'};
const SPOT_NAME={red:'赤',yellow:'黄',green:'緑',blue:'青',white:'白',orange:'オレンジ',purple:'紫',pink:'ピンク',sky:'水色'};
const SPOT_LIGHT=new Set(['yellow','white','pink','sky','orange']);   // 上の数字を黒にする明るい色
const SPOT_LAYOUTS={g22:'2×2',g23:'2×3',g33:'3×3',five:'サイコロの5',line4:'横に4つ',rand:'ばらばら'};
const SPOT_RAND={r15:[1.5,3], r2:[2,4], r3:[3,5]};
const spotIvTxt=c=>c.timing==='fixed'?`${c.iv}秒ごと`:`${SPOT_RAND[c.rand][0]}〜${SPOT_RAND[c.rand][1]}秒`;
function spotCal(){
  const d={top:6,bottom:6,left:6,right:6,size:100,rot:false};
  try{ return {...d, ...(JSON.parse(localStorage.getItem('notore-proj-cal')||'{}'))}; }catch(e){ return d; }
}
function spotCalSave(c){ try{ localStorage.setItem('notore-proj-cal',JSON.stringify(c)); }catch(e){} }
function spotCount(c){ return {g22:4,g23:6,g33:9,five:5,line4:4,rand:c.count||6}[c.layout]; }
// 丸の中心（0〜1）。ばらばらは重ならないように置く
function spotPlace(c){
  const n=spotCount(c);
  if(c.layout==='five') return [[.2,.22],[.8,.22],[.5,.5],[.2,.78],[.8,.78]];
  if(c.layout==='line4') return [0,1,2,3].map(i=>[(i+.5)/4,.5]);
  if(c.layout!=='rand'){
    const [r,cc]={g22:[2,2],g23:[2,3],g33:[3,3]}[c.layout], out=[];
    for(let y=0;y<r;y++) for(let x=0;x<cc;x++) out.push([(x+.5)/cc,(y+.5)/r]);
    return out;
  }
  for(let tries=0;tries<400;tries++){
    const pts=[]; let ok=true;
    for(let i=0;i<n&&ok;i++){
      let placed=false;
      for(let k=0;k<200;k++){
        const p=[.13+Math.random()*.74,.15+Math.random()*.7];
        if(pts.every(q=>Math.hypot(q[0]-p[0],(q[1]-p[1])*.75)>.26)){ pts.push(p); placed=true; break; }
      }
      ok=placed;
    }
    if(ok) return pts;
  }
  return [[.2,.25],[.5,.25],[.8,.25],[.2,.75],[.5,.75],[.8,.75],[.35,.5],[.65,.5]].slice(0,n);
}
function spotLabels(c){
  const n=spotCount(c);
  let nums=[...Array(n)].map((_,i)=>i+1); if(c.order==='shuf') nums=shuffle(nums);
  const cols=shuffle(SPOT_COLORS).slice(0,n);
  return nums.map((v,i)=>({num:v,col:cols[i]}));
}
// 丸を描く（box の大きさに合わせて px で置く）
function spotRender(box,c,place,labels,cal){
  box.style.top=cal.top+'%'; box.style.bottom=cal.bottom+'%'; box.style.left=cal.left+'%'; box.style.right=cal.right+'%';
  const W=box.clientWidth, H=box.clientHeight; if(!W||!H) return;
  const cols={g22:2,g23:3,g33:3,line4:4}[c.layout], rows={g22:2,g23:2,g33:3,line4:1}[c.layout];
  let d = cols ? Math.min(W/cols,H/rows)*.78 : Math.min(W,H)*(c.layout==='five'?.3:.24);
  d*=cal.size/100;
  box.innerHTML=place.map((p,i)=>{
    const L=labels[i], showNum=c.content!=='col', showCol=c.content!=='num';
    const bg = showCol ? WALL_COLORS[L.col].c : '#f1f2f4';
    const fg = !showCol || SPOT_LIGHT.has(L.col) ? '#111' : '#fff';
    return `<div class="spot" data-i="${i}" style="width:${d}px;height:${d}px;left:${p[0]*W-d/2}px;top:${p[1]*H-d/2}px;background:${bg};color:${fg};font-size:${d*.5}px">${showNum?L.num:''}</div>`;
  }).join('');
}

let P=null;
function stopSpot(){
  if(!P) return;
  P.timers.forEach(clearTimeout); clearInterval(P.clock);
  sayStop(); wakeOff();
  $('sWall').style.display='none'; $('sCtl').style.display='none';
  P=null;
}
function spotLater(fn,ms){ const p=P; const id=setTimeout(()=>{ if(P===p && !p.paused) fn(); },ms); p.timers.push(id); }
function runSpot(cfg){
  stopAll(); audioOn(); say(' ',true); wakeOn(); fullOn();
  const cal=spotCal();
  P={cfg, cal, place:spotPlace(cfg), labels:spotLabels(cfg), timers:[], clock:null, count:0, last:-1, left:cfg.dur, paused:false, started:false};
  const wall=$('sWall'); wall.style.display='block'; wall.classList.remove('cal');
  $('sRot').style.transform=cal.rot?'rotate(180deg)':'';
  $('sCalPanel').style.display='none'; $('sCtl').style.display='none';
  $('sHud').textContent='';
  spotRender($('sBox'),cfg,P.place,P.labels,cal);
  say('はじめます',true);
  let n=3; const cd=$('sCd');
  const step=()=>{
    if(n<=0){ cd.textContent=''; spotStart(); return; }
    cd.textContent=n; SND.count(now()+0.01); n--; spotLater(step,1000);
  };
  spotLater(step,900);
}
function spotStart(){
  P.started=true;
  P.clock=setInterval(()=>{
    if(!P||P.paused) return;
    P.left--; $('sHud').textContent=`残り ${Math.max(0,P.left)}s ・ ${P.count}回`;
    if(P.left<=0) spotDone();
  },1000);
  spotCue();
}
function spotCue(){
  if(!P) return;
  const c=P.cfg, n=P.labels.length;
  if(c.reshuffle && P.count>0 && P.count%8===0){        // ときどき並びを入れ替える
    P.labels=spotLabels(c); if(c.layout==='rand') P.place=spotPlace(c);
    spotRender($('sBox'),c,P.place,P.labels,P.cal);
  }
  let t; do{ t=rnd(n); }while(t===P.last && n>1); P.last=t;
  const L=P.labels[t];
  const by = c.content==='num' ? 'num' : c.content==='col' ? 'col' : (c.instr==='mix' ? (Math.random()<.5?'num':'col') : c.instr);
  const light=c.signal!=='voice', voice=c.signal!=='light';
  [...$('sBox').children].forEach((el,i)=>{ el.classList.toggle('hot',light&&i===t); el.classList.toggle('dim',light&&i!==t); });
  if(light){ const el=$('sBox').children[t]; if(el){ el.classList.remove('pulse'); void el.offsetWidth; el.classList.add('pulse'); } }
  if(voice) say(by==='num'?numTxt(L.num):SPOT_SAY[L.col],true);
  else tone(now()+0.01,1100,0.08,0.35);
  P.count++; $('sHud').textContent=`残り ${Math.max(0,P.left)}s ・ ${P.count}回`;
  const iv=c.timing==='fixed'?c.iv:(()=>{ const [a,b]=SPOT_RAND[c.rand]; return a+Math.random()*(b-a); })();
  spotLater(spotCue,Math.round(iv*1000));
}
function spotPause(on){
  if(!P||!P.started) return;
  P.paused=on;
  P.timers.forEach(clearTimeout); P.timers=[];
  $('sPause').textContent=on?'▶ 続ける':'Ⅱ 一時停止';
  if(!on){ $('sCtl').style.display='none'; spotCue(); }
}
function spotDone(early){
  const p=P; if(!p) return;
  const c=p.cfg, n=p.count, secs=c.dur-Math.max(0,p.left);
  p.timers.forEach(clearTimeout); clearInterval(p.clock); p.paused=true;
  [...$('sBox').children].forEach(el=>el.classList.remove('hot','dim'));
  say(early?'おつかれさまでした':'おわりです',true);
  setTimeout(()=>{
    if(P!==p) return;
    stopSpot(); fullOff();
    finish({ type:'spot', cfg:c, title:early?'途中で終了':'完了', note:'おつかれさまでした',
      stats:[['指示',n+'回'],['時間',fmtSecs(secs)],['並べ方',SPOT_LAYOUTS[c.layout]],['切り替え',spotIvTxt(c)]] });
  },1300);
}
// 映しているあいだ：画面をタップすると操作の帯、キーボードは Space＝一時停止、Esc＝やめる
$('sWall').addEventListener('click',e=>{
  if(e.target.closest('#sCtl')||e.target.closest('#sCalPanel')) return;
  if($('sWall').classList.contains('cal')){ $('sCalPanel').style.display='block'; return; }
  if(!P) return;
  const ctl=$('sCtl'); ctl.style.display = ctl.style.display==='flex' ? 'none' : 'flex';
});
$('sPause').onclick=()=>spotPause(!(P&&P.paused));
$('sStop').onclick=()=>{ if(P) spotDone(true); };
document.addEventListener('keydown',e=>{
  if(!P && !$('sWall').classList.contains('cal')) return;
  if(e.code==='Space'){ e.preventDefault(); if(P) spotPause(!P.paused); }
  else if(e.code==='Escape'){ if(P) spotDone(true); else spotCalClose(); }
});
window.addEventListener('resize',()=>{
  if(P) spotRender($('sBox'),P.cfg,P.place,P.labels,P.cal);
  else if($('sWall').classList.contains('cal')) spotCalDraw();
});

/* ---- 映す範囲を合わせる ---- */
let SCAL=null;
function spotCalOpen(cfg){
  stopAll(); fullOn();
  SCAL={cfg, cal:spotCal(), place:spotPlace(cfg), labels:spotLabels(cfg)};
  const wall=$('sWall'); wall.style.display='block'; wall.classList.add('cal');
  $('sCd').textContent=''; $('sHud').textContent=''; $('sCtl').style.display='none';
  const c=SCAL.cal, pn=$('sCalPanel'); pn.style.display='block';
  const sl=(k,lab,min,max)=>`<label class="calrow"><span>${lab}</span><input type="range" min="${min}" max="${max}" value="${c[k]}" data-k="${k}"><b id="cal_${k}">${c[k]}${k==='size'?'%':'%'}</b></label>`;
  pn.innerHTML=`<div class="calt">映す範囲を合わせる</div>
    <p>白い枠が、壁や床で使いたい範囲に収まるように余白を動かします。丸がちょうど届く大きさにしてください。</p>
    ${sl('top','上の余白',0,35)}${sl('bottom','下の余白',0,35)}${sl('left','左の余白',0,35)}${sl('right','右の余白',0,35)}${sl('size','丸の大きさ',50,150)}
    <label class="calrow"><span>180°回す</span><button class="toggle${c.rot?' on':''}" id="calRot"></button><b></b></label>
    <p class="calsub">床に映していて、文字がさかさまに見えるときは「180°回す」をオン。</p>
    <div class="btnrow"><button class="btn quiet" id="calHide">パネルを隠す</button><button class="btn" id="calDone">完了</button></div>`;
  pn.querySelectorAll('input[type=range]').forEach(r=>r.oninput=()=>{
    c[r.dataset.k]=+r.value; $('cal_'+r.dataset.k).textContent=r.value+'%'; spotCalSave(c); spotCalDraw();
  });
  $('calRot').onclick=()=>{ c.rot=!c.rot; $('calRot').classList.toggle('on',c.rot); spotCalSave(c); spotCalDraw(); };
  $('calHide').onclick=e=>{ e.stopPropagation(); pn.style.display='none'; };
  $('calDone').onclick=e=>{ e.stopPropagation(); spotCalClose(); };
  spotCalDraw();
}
function spotCalDraw(){
  if(!SCAL) return;
  $('sRot').style.transform=SCAL.cal.rot?'rotate(180deg)':'';
  spotRender($('sBox'),SCAL.cfg,SCAL.place,SCAL.labels,SCAL.cal);
}
function spotCalClose(){
  SCAL=null; const wall=$('sWall'); wall.classList.remove('cal'); wall.style.display='none';
  $('sCalPanel').style.display='none'; fullOff();
}
const spotAutoCfg=()=>({layout:'g33',count:6,content:'both',order:'shuf',instr:'mix',signal:'both',timing:'rand',iv:3,rand:'r2',dur:60,reshuffle:false});
function spotReadCfg(){
  return { layout:segVal('spLayout'), count:+segVal('spCount'), content:segVal('spContent'), order:segVal('spOrder'),
    instr:segVal('spInstr'), signal:segVal('spSignal'), timing:segVal('spTiming'), iv:+segVal('spIv'), rand:segVal('spRand'),
    dur:+$('spDur').value, reshuffle:$('spShuffle').classList.contains('on') };
}

/* ============================================================
   Results
   ============================================================ */
let last=null;
const TYPE_NAME={spot:'丸タッチ',arrow:'方向トレーニング',num:'数字記憶',stroop:'ストループ',voice:'ストループ（音声）',grid:'ストループ 一覧',move:'リズム運動',hands:'左右の手まね',breath:'呼吸調整',mem:'数字の位置記憶',card:'フラッシュ'};
function finish(r){
  last=r;
  if(r.celebrate){
    const cb=r.celebrate, R=58, C=2*Math.PI*R, o=C*(1-cb.hits/cb.total);
    $('verdict').className='verdict cele pop-in '+(cb.tier||'');
    $('verdict').innerHTML=`
      <div class="medal">
        <svg viewBox="0 0 132 132">
          <circle class="mt" cx="66" cy="66" r="${R}"></circle>
          <circle class="mb" cx="66" cy="66" r="${R}" stroke-dasharray="${C}"
                  style="--c:${C};--o:${o};stroke-dashoffset:${o}"></circle>
        </svg>
        <div class="mnum"><div><b class="tnum">${cb.hits}</b><s> / ${cb.total} 問</s></div></div>
      </div>
      <div class="ck">COMPLETE</div><h2>${cb.title}</h2><p>${cb.note}</p>`;
  } else {
    $('verdict').className='verdict';
    $('verdict').innerHTML=`<div class="ic">${ICON.check}</div><h2>${r.title}</h2><p>${r.note}</p>`;
  }
  $('stats').innerHTML=r.stats.map(s=>`<div class="stat"><div class="n tnum">${s[1]}</div><div class="l">${s[0]}</div></div>`).join('');
  $('qlist').innerHTML = r.log&&r.log.length
    ? r.log.map((l,i)=>`<div class="qrow"><span class="qi">${i+1}</span>
        <span class="qm ${l.ok?'ok':'ng'}">${l.ok?ICON.check:ICON.cross}</span>
        <span class="qa tnum">${l.exp}</span>
        ${l.ok?'':`<span class="qb tnum">${l.ans||'—'}</span>`}</div>`).join('')
    : '';
  show('results','結果', TYPE_NAME[r.type]||'');
}
$('rHome').onclick=()=>{ stopAll(); stopProg(); goHome(); };
$('rAgain').onclick=()=>{
  if(!last) return;
  if(last.autoType) startAuto(last.autoType);   // build a fresh random program
  else rerun(last.type,last.cfg);
};
function rerun(type,cfg){
  if(type==='arrow') runArrow(cfg);
  else if(type==='num') runNum(cfg);
  else if(type==='stroop') runStroop(cfg);
  else if(type==='grid') runGrid(cfg);
  else if(type==='move') runMove(cfg);
  else if(type==='hands') runHands(cfg);
  else if(type==='breath') runBreath(cfg);
  else if(type==='mem') runMem(cfg);
  else if(type==='card') runCard(cfg);
  else if(type==='spot') runSpot(cfg);
  else runVoice(cfg);
}

/* ============================================================
   Boot
   ============================================================ */
projSet(projPref(),false);
goHome();

/* ============================================================
   Version check — 古い保存済みの画面が出ていたら、新しい版に切り替える
   （GitHub Pages は更新後しばらく古い版を返すことがあるため）
   ============================================================ */
const APP_VER='2026-11-05 18:20';   // 更新のたびにこの日時を書き換える
$('appVer').textContent='更新 '+APP_VER;
(function checkVer(){
  if(location.protocol==='file:') return;
  fetch(location.pathname+'?check='+Date.now(),{cache:'no-store'})
    .then(r=>r.ok?r.text():'')
    .then(t=>{
      const m=t.match(/const APP_VER='([^']+)'/);
      if(m && m[1]!==APP_VER){
        const key='notore-ver-jump';
        let tried=null; try{ tried=sessionStorage.getItem(key); }catch(e){}
        if(tried===m[1]) return;                        // 一度切り替えたら、くり返さない
        try{ sessionStorage.setItem(key,m[1]); }catch(e){}
        location.replace(location.pathname+'?v='+encodeURIComponent(m[1]));
      }
    }).catch(()=>{});
})();
