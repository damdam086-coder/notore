<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>NoTore</title>
<style>
/* ============================================================
   Design tokens
   ============================================================ */
:root{
  --bg:#f6f7f9;
  --surface:#ffffff;
  --surface-2:#f0f2f5;
  --text:#15181d;
  --text-2:#5b6472;
  --text-3:#8b94a3;
  --line:#e3e6ec;
  --line-2:#d3d8e0;
  --accent:#2f6bff;
  --accent-soft:rgba(47,107,255,.10);
  --ok:#1a9d5a;
  --ng:#d94141;
  --gold:#c8931b;
  --lock:#b3bac5;

  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
  --r1:10px; --r2:14px; --r3:20px; --r4:28px;
  --shadow:0 1px 2px rgba(16,20,28,.05), 0 8px 24px rgba(16,20,28,.05);
  --font:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0e1014;
    --surface:#171a20;
    --surface-2:#1e222a;
    --text:#e9edf3;
    --text-2:#a3abb9;
    --text-3:#78808e;
    --line:#252a33;
    --line-2:#333a45;
    --accent:#5b8cff;
    --accent-soft:rgba(91,140,255,.14);
    --ok:#35c17c;
    --ng:#ff6b6b;
    --gold:#e8b93f;
    --lock:#4a5261;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  }
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--text); font-family:var(--font);
  -webkit-font-smoothing:antialiased; overscroll-behavior:none;
  font-size:16px; line-height:1.5;
}
button{font-family:inherit;color:inherit}
.tnum{font-variant-numeric:tabular-nums}

/* ============================================================
   Shell
   ============================================================ */
.app{
  max-width:520px; margin:0 auto; min-height:100dvh;
  display:flex; flex-direction:column;
  padding:max(12px,env(safe-area-inset-top)) var(--s4) max(16px,env(safe-area-inset-bottom));
}
.topbar{
  display:flex; align-items:center; gap:var(--s2);
  height:52px; flex:none;
}
.topbar h1{
  font-size:17px; font-weight:650; letter-spacing:.01em; margin:0;
}
.topbar .sub{font-size:13px;color:var(--text-3);font-weight:500}
.iconbtn{
  width:36px;height:36px;flex:none;display:grid;place-items:center;
  background:none;border:none;border-radius:var(--r1);cursor:pointer;
  color:var(--text-2); margin-left:-8px;
}
.iconbtn:active{background:var(--surface-2)}
.iconbtn svg{width:22px;height:22px}
.spacer{flex:1}

.screen{display:none; flex:1; flex-direction:column; min-height:0}
.screen.on{display:flex; animation:in .22s cubic-bezier(.2,.7,.3,1)}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ============================================================
   Building blocks
   ============================================================ */
.card{
  background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r3); box-shadow:var(--shadow);
}
.pad{padding:var(--s4)}
.stack>*+*{margin-top:var(--s3)}

.menu{
  display:flex; align-items:center; gap:var(--s4);
  width:100%; text-align:left; padding:var(--s4);
  background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r3); box-shadow:var(--shadow);
  cursor:pointer; transition:transform .14s ease;
}
.menu:active{transform:scale(.985)}
.menu .ico{
  width:46px;height:46px;flex:none;border-radius:var(--r2);
  display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);
}
.menu .ico svg{width:24px;height:24px}
.menu .t{flex:1;min-width:0}
.menu .t h2{margin:0;font-size:16px;font-weight:640;letter-spacing:.01em}
.menu .t p{margin:2px 0 0;font-size:13px;color:var(--text-3);line-height:1.45}
.menu .chev{color:var(--text-3);flex:none}
.menu .chev svg{width:18px;height:18px;display:block}

.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0;padding-bottom:var(--s4)}

.row{
  display:flex;align-items:center;justify-content:space-between;gap:var(--s2) var(--s3);
  flex-wrap:wrap; padding:var(--s3) 0; border-bottom:1px solid var(--line);
}
.row:last-child{border-bottom:none}
.row .lbl{font-size:15px;font-weight:500;white-space:nowrap}
.row .val{font-size:15px;font-weight:650;color:var(--accent)}
.hint{font-size:13px;color:var(--text-3);line-height:1.6;margin-top:var(--s2)}

.seg{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;flex:1 1 auto}
.seg button{
  padding:7px 13px;border:1px solid var(--line-2);background:var(--surface);
  border-radius:999px;font-size:13.5px;font-weight:560;cursor:pointer;color:var(--text-2);
}
.seg button.on{background:var(--accent);border-color:var(--accent);color:#fff}

input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:28px;background:none;margin:0;
}
input[type=range]::-webkit-slider-runnable-track{height:4px;background:var(--line-2);border-radius:2px}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:var(--surface);
  border:1.5px solid var(--line-2);box-shadow:0 1px 4px rgba(16,20,28,.18);margin-top:-10px;cursor:pointer;
}
input[type=range]::-moz-range-track{height:4px;background:var(--line-2);border-radius:2px}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--surface);border:1.5px solid var(--line-2);cursor:pointer}

.toggle{
  width:48px;height:29px;border-radius:999px;background:var(--line-2);
  border:none;position:relative;cursor:pointer;flex:none;transition:background .18s;
}
.toggle::after{
  content:"";position:absolute;top:3px;left:3px;width:23px;height:23px;border-radius:50%;
  background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .18s;
}
.toggle.on{background:var(--accent)}
.toggle.on::after{transform:translateX(19px)}

.btn{
  display:block;width:100%;padding:15px;border:none;border-radius:var(--r2);
  background:var(--accent);color:#fff;font-size:16px;font-weight:650;cursor:pointer;
  transition:transform .12s ease, opacity .12s;
}
.btn:active{transform:scale(.985);opacity:.9}
.btn.sub{background:var(--surface);color:var(--text);border:1px solid var(--line-2);box-shadow:none}
.btn.quiet{background:var(--surface-2);color:var(--text-2)}
.btnrow{display:flex;gap:var(--s2);flex:none;margin-top:var(--s3)}
.btnrow .btn{margin:0}
.foot{flex:none;padding-top:var(--s3)}

/* ============================================================
   Play surface
   ============================================================ */
.stage{flex:1;display:flex;flex-direction:column;min-height:0}
.hud{
  display:flex;justify-content:space-between;align-items:center;gap:var(--s3);
  padding:0 2px var(--s3);flex:none;font-size:13px;color:var(--text-3);font-weight:500;
}
.hud b{color:var(--text);font-weight:680;font-size:14px}

.field{
  flex:1;min-height:200px;position:relative;border-radius:var(--r4);
  background:var(--surface);border:1px solid var(--line);
  display:grid;place-items:center;overflow:hidden;
}
.field.light{background:#fff;border-color:rgba(0,0,0,.08)}
.tag{
  position:absolute;top:16px;left:0;right:0;text-align:center;
  font-size:13px;font-weight:640;color:var(--text-3);letter-spacing:.02em;
}
.field.light .tag{color:#6b7280}

/* arrow */
/* rotation lives on the <svg>; the pop scale animates the wrapper so it never
   overrides the rotate() transform (otherwise the arrow flashes upright) */
#aArrow{width:100%;display:grid;place-items:center}
#aArrow.pop{animation:pop .16s cubic-bezier(.2,.8,.3,1)}
.arrow{width:min(58%,300px);color:var(--text);display:block}
@keyframes pop{from{transform:scale(.72);opacity:.25}to{transform:scale(1);opacity:1}}

/* stroop word */
.word{font-weight:750;line-height:1.08;white-space:nowrap;letter-spacing:.01em}
.word.pop{animation:pop .16s cubic-bezier(.2,.8,.3,1)}

/* stroop grid (sheet of many words) */
#gField{place-items:stretch}
.gridwrap{
  width:100%;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:44px 14px 16px;display:grid;gap:10px;justify-items:stretch;
}
.gw{display:grid;place-items:center;font-weight:750;line-height:1.05;white-space:nowrap;text-align:center;z-index:1}
.gw.cellbg{border-radius:13px}
.band{border-radius:11px;z-index:0}
.prep-two{display:flex;flex-direction:column;gap:8px;margin-top:var(--s4)}
.prep-two .prep-ex{margin-top:0;position:relative}
.prep-ex .bl{position:absolute;top:-9px;right:12px;font-size:10px;font-weight:700;color:#fff;background:var(--accent);padding:2px 8px;border-radius:999px}
.cellsw{display:inline-grid;place-items:center;width:36px;height:36px;flex:none;border-radius:10px;background:#eef0f3;font-weight:750;font-size:17px;color:#333}

/* overlays */
.veil{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:var(--s2);
  background:var(--surface);z-index:5;
}
.field.light .veil{background:#fff}
.veil .big{font-size:76px;font-weight:750;color:var(--accent);line-height:1}
.veil .lab{font-size:14px;color:var(--text-3);font-weight:550}
.field.light .veil{color:#15181d}
.field.light .veil .lab{color:#6b7280}

/* rule confirmation before a session starts */
.prep{padding:var(--s5) var(--s4);text-align:center;max-width:340px;width:100%}
.prep-k{font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--text-3)}
.field.light .prep-k{color:#8b94a3}
.prep-t{font-size:22px;font-weight:700;margin-top:6px;letter-spacing:.01em}
.prep-s{font-size:13.5px;color:var(--text-3);margin-top:8px;line-height:1.65}
.field.light .prep-s{color:#6b7280}
.prep-ex{
  display:flex;align-items:center;justify-content:center;gap:14px;
  margin-top:var(--s4);padding:14px;border-radius:var(--r2);
  background:var(--surface-2);font-size:15px;
}
.field.light .prep-ex{background:#f1f2f5}
.prep-ex .w{font-size:32px;font-weight:750;line-height:1.1}
.prep-ex .ar{color:var(--text-3);font-size:17px}
.field.light .prep-ex .ar{color:#8b94a3}
.prep-ex .a{font-size:19px;font-weight:700}
.prep-b{margin-top:var(--s5)}
.prep-list{margin-top:var(--s4);display:flex;flex-direction:column;gap:8px;text-align:left}
.prep-li{
  display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:var(--r2);
  background:var(--surface-2);font-size:15px;line-height:1.35;
}
.field.light .prep-li{background:#f1f2f5}
.prep-li .ma{flex:none}
.prep-li .act{margin-left:auto;font-weight:700;white-space:nowrap}
.prep-li .act.same{color:var(--accent)}
.prep-li .act.opp{color:var(--ng)}
.veil .mark{width:76px;height:76px}
.veil .ans{font-size:19px;font-weight:680}
.veil .said{font-size:13px;color:var(--text-3)}
.field.light .veil .ans{color:#15181d}
.field.light .veil .said{color:#8b94a3}

/* number ring */
.ring{position:relative;width:min(78%,300px);aspect-ratio:1;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring .track{fill:none;stroke:var(--surface-2);stroke-width:8}
.ring .bar{fill:none;stroke:var(--accent);stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset linear,stroke .3s}
.ring .num{font-weight:750;letter-spacing:.02em;white-space:nowrap;z-index:1}
.below{margin-top:var(--s4);text-align:center;flex:none}
.below .rem{font-size:15px;color:var(--text-3);font-weight:550}
.below .rem b{font-size:22px;color:var(--accent);font-weight:750}
.below .rem.low b{color:var(--ng)}

.numpad{width:100%;text-align:center}
.numin{
  width:100%;padding:14px;font-size:28px;font-weight:650;text-align:center;letter-spacing:.1em;
  border:1px solid var(--line-2);border-radius:var(--r2);background:var(--surface);color:var(--text);
  outline:none;
}
.numin:focus{border-color:var(--accent)}

/* voice status */
.vstat{
  flex:none;display:flex;align-items:center;justify-content:center;gap:8px;
  padding:var(--s3) 0;font-size:14px;color:var(--text-3);min-height:44px;text-align:center;
}
.vstat svg{width:17px;height:17px;flex:none}
.vstat b{color:var(--text);font-weight:640}

/* ============================================================
   Results
   ============================================================ */
.verdict{text-align:center;padding:var(--s5) var(--s4) var(--s4)}
.verdict .ic{width:56px;height:56px;margin:0 auto var(--s3);display:grid;place-items:center;border-radius:50%;
  background:var(--accent-soft);color:var(--accent)}
.verdict .ic svg{width:30px;height:30px}
.verdict h2{margin:0;font-size:21px;font-weight:700;letter-spacing:.01em}
.verdict p{margin:6px 0 0;font-size:14px;color:var(--text-3)}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2);padding:0 var(--s4) var(--s4)}
.stat{background:var(--surface-2);border-radius:var(--r2);padding:14px;text-align:center}
.stat .n{font-size:23px;font-weight:730;letter-spacing:-.01em}
.stat .l{font-size:12px;color:var(--text-3);margin-top:3px;font-weight:520}

/* quick-start (auto program) card */
.quick{margin-bottom:var(--s4)}
.quick .qk{font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--accent)}
.quick .qt{margin:6px 0 0;font-size:19px;font-weight:700;letter-spacing:.01em}
.quick .qp{margin:8px 0 var(--s4);font-size:13.5px;color:var(--text-3);line-height:1.65}
.seclbl{font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--text-3);margin:0 0 var(--s2) 2px}

/* stage break */
.brkstage{justify-content:center;align-items:center}
.brk{text-align:center;padding:var(--s5) var(--s4)}
.brk-k{font-size:14px;color:var(--text-3);font-weight:550}
.brk-num{font-size:76px;font-weight:750;color:var(--accent);line-height:1.1;margin-top:var(--s3)}
.brk-lab{font-size:13.5px;color:var(--text-3);margin-top:4px}
.dots{display:flex;gap:7px;justify-content:center;margin-top:var(--s4)}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line-2);display:block}
.dots i.on{background:var(--accent)}

/* completion celebration */
.cele{text-align:center;padding:var(--s6) var(--s4) var(--s4)}
.cele .medal{position:relative;width:132px;height:132px;margin:0 auto var(--s4)}
.cele .medal svg{position:absolute;inset:0;transform:rotate(-90deg)}
.cele .mt{fill:none;stroke:var(--surface-2);stroke-width:7}
.cele .mb{fill:none;stroke:var(--accent);stroke-width:7;stroke-linecap:round;
  animation:draw 1s cubic-bezier(.2,.8,.3,1) forwards}
.cele.perfect .mb{stroke:var(--gold)}
.cele.good .mb{stroke:var(--ok)}
@keyframes draw{from{stroke-dashoffset:var(--c)}to{stroke-dashoffset:var(--o)}}
.cele .mnum{position:absolute;inset:0;display:grid;place-items:center;flex-direction:column}
.cele .mnum b{font-size:38px;font-weight:750;line-height:1}
.cele .mnum s{text-decoration:none;font-size:12px;color:var(--text-3);margin-top:2px}
.cele .ck{font-size:11px;font-weight:700;letter-spacing:.16em;color:var(--accent)}
.cele.perfect .ck{color:var(--gold)} .cele.good .ck{color:var(--ok)}
.cele h2{margin:8px 0 0;font-size:24px;font-weight:750;letter-spacing:.01em}
.cele p{margin:8px 0 0;font-size:14px;color:var(--text-3);line-height:1.6}
.pop-in{animation:popin .5s cubic-bezier(.2,.8,.3,1) both}
@keyframes popin{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:none}}

.qlist{padding:0 var(--s4) var(--s4)}
.qrow{
  display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);
  font-size:14px;
}
.qrow:last-child{border-bottom:none}
.qrow .qi{width:20px;color:var(--text-3);font-size:12.5px;flex:none}
.qrow .qm{width:18px;height:18px;flex:none}
.qrow .qm.ok{color:var(--ok)} .qrow .qm.ng{color:var(--ng)}
.qrow .qa{flex:1;font-weight:600}
.qrow .qb{color:var(--text-3);font-size:12.5px}

/* ============================================================
   Rhythm exercise (metronome / seconds)
   ============================================================ */
.mv{display:flex;flex-direction:column;align-items:center;gap:4px;padding:40px 16px 18px;width:100%}
.mv-ex{font-size:30px;font-weight:750;letter-spacing:.02em;text-align:center;line-height:1.2}
.mv-d{font-size:13.5px;color:var(--text-3);text-align:center}
.pulse{--p:0;position:relative;width:min(60vw,230px);aspect-ratio:1;border-radius:50%;margin-top:var(--s4);
  background:conic-gradient(var(--accent) calc(var(--p) * 1turn), var(--surface-2) 0);display:grid;place-items:center}
.pulse-in{width:calc(100% - 16px);aspect-ratio:1;border-radius:50%;background:var(--surface);
  display:flex;flex-direction:column;align-items:center;justify-content:center}
.pulse b{font-size:66px;font-weight:750;line-height:1;color:var(--text)}
.pulse b.chg{animation:chg .9s ease-out}
@keyframes chg{0%{color:var(--ng);transform:scale(1.18)}100%{color:var(--text);transform:none}}
.pulse span{font-size:12.5px;color:var(--text-3);margin-top:6px;font-weight:550}
.pulse.hit{animation:beat .2s ease-out}
.pulse.hit .pulse-in{animation:flash .24s ease-out}
@keyframes beat{0%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes flash{0%{box-shadow:inset 0 0 0 200px var(--accent-soft)}100%{box-shadow:inset 0 0 0 200px transparent}}
.mv-dir{min-height:28px;font-size:14px;font-weight:550;color:var(--text-3);margin-top:var(--s3);text-align:center}
.mv-dir.on{font-size:19px;font-weight:720;color:var(--accent)}
.mv-dir.flip{animation:pop .3s cubic-bezier(.2,.8,.3,1)}
.beats{display:flex;gap:9px;justify-content:center;margin-top:var(--s3);min-height:16px}
.beats i{width:12px;height:12px;border-radius:50%;background:var(--line-2);display:block;transition:background .08s}
.beats i:first-child{width:16px;height:16px;margin-top:-2px}
.beats i.on{background:var(--accent)}
.beats i.done{background:var(--accent-soft)}
.mv-beat{font-size:13.5px;color:var(--text-2);font-weight:600;margin-top:6px;min-height:20px}
.mv-beat.chg{animation:pop .3s cubic-bezier(.2,.8,.3,1);color:var(--ng)}
.veil .mv-intro{font-size:34px;font-weight:750;letter-spacing:.02em;margin:4px 0}
.veil .mv-mode{font-size:15px;font-weight:640;color:var(--text-2)}

/* ============================================================
   Hands (copy left / right hand shapes)
   ============================================================ */
#hField{place-items:stretch}
.hands{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center;width:100%;height:100%;padding:44px 12px 20px}
.hcol{display:flex;flex-direction:column;align-items:center;min-width:0}
.hl{font-size:16px;font-weight:720;color:var(--text-2);letter-spacing:.06em;margin-bottom:6px}
.hbox{width:100%;display:grid;place-items:center}
.hbox.pop{animation:pop .2s cubic-bezier(.2,.8,.3,1)}
.hand{width:100%;max-width:210px;display:block}
.hbox{max-width:210px;aspect-ratio:210/256}
.hnum{font-size:min(34vw,170px);font-weight:760;line-height:1;color:var(--text);letter-spacing:-.02em}
.hnum.word{font-size:clamp(24px,8vw,40px);letter-spacing:.02em;text-align:center}
.hand-img{width:100%;max-width:210px;display:block}
.hand-img.mir{transform:scaleX(-1)}
.hand .hs{fill:none;stroke:#c98f6c;stroke-width:6;stroke-linejoin:round}
.hand .hf{fill:#f6d3b5;fill-rule:evenodd}
.hand .hn rect{fill:#fbe8da;stroke:#e2b393;stroke-width:1.5}
.hand .hn .cr{fill:none;stroke:#d39d7b;stroke-width:2.5;stroke-linecap:round}
.hname{font-size:16px;font-weight:700;margin-top:8px;min-height:24px;visibility:hidden}
#hField.named .hname{visibility:visible}
.hands-ex{gap:18px}
.hands-ex>div{width:96px;text-align:center}
.hands-ex .hl{font-size:12px;margin-bottom:2px}

/* ============================================================
   Breath
   ============================================================ */
.bwrap{position:relative;width:min(72vw,270px);aspect-ratio:1;display:grid;place-items:center}
.bub{position:absolute;inset:0;border-radius:50%;background:var(--accent-soft);border:2px solid var(--accent);
  transform:scale(1);will-change:transform}
.bub.hold{border-style:dashed;border-color:var(--gold);background:rgba(200,147,27,.10)}
.bub.in{border-color:var(--ok);background:rgba(26,157,90,.10)}
.btext{position:relative;text-align:center}
.bphase{font-size:32px;font-weight:760;letter-spacing:.04em}
.bnum{font-size:60px;font-weight:750;line-height:1.05;color:var(--text-2);min-height:63px}

/* ============================================================
   Memory grid (numbers' positions)
   ============================================================ */
#wField{place-items:center}
.mgrid{display:grid;justify-content:center;align-content:center;padding-top:28px}
.mc{border-radius:10px;border:1px dashed var(--line-2);background:transparent;padding:0;margin:0;
  display:grid;place-items:center;font:inherit;font-weight:760;line-height:1;color:var(--text);cursor:pointer;
  font-variant-numeric:tabular-nums;touch-action:manipulation}
.mc.num{border-color:transparent}
.mc.seen{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.ver{flex:none;text-align:center;font-size:11.5px;color:var(--text-3);padding:var(--s3) 0 2px}
.mc.miss{animation:shake .25s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.mc.sq{background:var(--text);border-color:var(--text)}
.mc.ok{background:var(--ok);border-color:var(--ok);color:#fff;animation:pop .16s cubic-bezier(.2,.8,.3,1)}
.mc.show{background:var(--surface-2);border:1px solid var(--line-2);color:var(--text-3)}
.mc.want{border:2px solid var(--accent);color:var(--accent)}
.mc.ng{background:var(--ng);border-color:var(--ng);color:#fff}

/* ============================================================
   Card flash
   ============================================================ */
#cField{background:radial-gradient(circle at 50% 40%,#2a8f5a,#1b6b42);border-color:rgba(0,0,0,.15)}
.ccard{height:min(78%,460px);aspect-ratio:5/7;max-width:84%;background:#fff;border-radius:6%/4.3%;
  box-shadow:0 10px 30px rgba(0,0,0,.28);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4%;
  container-type:size}
.ccard.flip{animation:flip .14s ease-out}
@keyframes flip{from{opacity:.15;transform:scale(.94)}to{opacity:1;transform:none}}
.cnum{font-size:30cqh;font-weight:600;line-height:1;letter-spacing:-.02em;font-family:-apple-system,"Helvetica Neue",Arial,sans-serif}
.csuit{width:62%;height:auto;display:block}
.csuit.big{width:76%}
.prep-ex .mini{width:38px;height:38px}
#cField.mode-num{background:#fff;border-color:rgba(0,0,0,.08)}
#cField.mode-num .ccard,#cField.mode-color .ccard,#cField.mode-card .fnum,#cField.mode-color .fnum{display:none}
#cField.mode-num .fnum{display:block}
.fnum{display:none;font-size:min(62vw,52vh,340px);font-weight:700;line-height:1;letter-spacing:-.03em;font-family:-apple-system,"Helvetica Neue",Arial,sans-serif}
.fnum.flip{animation:flip .14s ease-out}
.fwall{position:fixed;inset:0;z-index:50}
.fwall-x{position:absolute;top:max(14px,env(safe-area-inset-top));left:14px;width:40px;height:40px;border-radius:50%;border:none;
  background:rgba(0,0,0,.28);color:#fff;font-size:22px;line-height:1;cursor:pointer}
.fwall-hud{position:absolute;top:max(20px,env(safe-area-inset-top));right:16px;display:flex;gap:12px;padding:6px 12px;border-radius:999px;
  background:rgba(0,0,0,.28);color:#fff;font-size:12.5px}
.fkind{margin-bottom:var(--s3)}
.fkind .seg{justify-content:stretch}
.fkind .seg button{flex:1;padding:10px 6px;font-size:14.5px}
.cdot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:-1px;box-shadow:0 0 0 1.5px #fff,0 0 0 2.5px rgba(0,0,0,.12)}

/* ============================================================
   Projector
   ============================================================ */
body.proj{--bg:#000;--surface:#000;--surface-2:#15171c;--text:#f4f6fa;--text-2:#c4cad4;--text-3:#8d95a3;--line:#22262d;--line-2:#3a404a;--shadow:none;
  --accent-soft:rgba(91,140,255,.16);background:#000;color:#f4f6fa}
body.proj .app{max-width:none}
body.proj #home .scroll,body.proj #hub .scroll,body.proj #results .scroll,body.proj .foot{max-width:560px;width:100%;margin-left:auto;margin-right:auto}
body.proj .field:not(.light):not(#cField){border:none;border-radius:0;background:#000}
body.proj #cField.mode-num{background:#000;border:none}
body.proj .arrow{width:min(76vmin,1100px)}
body.proj .ccard{height:min(90%,1000px)}
body.proj .ring{width:min(72vmin,900px)}
body.proj .hud{font-size:15px}
.projcard .row{border:none;padding:0}
.numbox{width:76px;padding:8px 6px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);color:var(--text);
  font:inherit;font-size:17px;font-weight:650;text-align:center;font-variant-numeric:tabular-nums}
.numbox:focus{outline:none;border-color:var(--accent)}
#mWideRow{justify-content:flex-start;flex-wrap:nowrap;gap:10px}
.numcell{display:flex;flex-direction:column;gap:3px;font-size:11.5px;color:var(--text-3);font-weight:600}
.numsep{padding-top:16px;color:var(--text-3)}
.spotwall{position:fixed;inset:0;z-index:60;background:#000;color:#fff;cursor:pointer}
.spotrot{position:absolute;inset:0}
.spotbox{position:absolute}
.spotwall.cal .spotbox{outline:3px dashed rgba(255,255,255,.85);outline-offset:0}
.spotwall.cal .spotrot::before{content:"";position:absolute;inset:0;border:2px solid rgba(255,255,255,.25)}
.spot{position:absolute;border-radius:50%;display:grid;place-items:center;font-weight:800;line-height:1;
  font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;transition:opacity .15s,transform .15s,box-shadow .15s}
.spot.dim{opacity:.32}
.spot.hot{transform:scale(1.08);box-shadow:0 0 0 .5vmin #fff,0 0 6vmin rgba(255,255,255,.55)}
.spot.pulse{animation:spotpulse .45s ease-out}
@keyframes spotpulse{0%{transform:scale(.9)}60%{transform:scale(1.14)}100%{transform:scale(1.08)}}
.spot-cd{position:absolute;inset:0;display:grid;place-items:center;font-size:30vmin;font-weight:800;pointer-events:none;color:#fff}
.spot-hud{position:absolute;right:14px;bottom:10px;font-size:13px;color:rgba(255,255,255,.4);pointer-events:none}
.spot-ctl{position:absolute;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);gap:8px;width:min(420px,90vw)}
.spot-ctl .btn{margin:0}
.spot-cal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(380px,92vw);max-height:90vh;overflow:auto;
  background:#15171c;border-color:#2b3039;color:#f4f6fa;cursor:default;--text-3:#9aa2b0;--line-2:#3a404a;--surface:#22262d}
.spot-cal .calt{font-size:16px;font-weight:700}
.spot-cal p{font-size:12.5px;color:#9aa2b0;line-height:1.6;margin:6px 0 10px}
.spot-cal .calsub{margin-top:2px}
.calrow{display:grid;grid-template-columns:86px 1fr 46px;align-items:center;gap:8px;font-size:13.5px;margin:2px 0}
.calrow b{text-align:right;font-variant-numeric:tabular-nums;color:#8fb0ff}
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <button class="iconbtn" id="back" style="display:none" aria-label="戻る"></button>
    <div>
      <h1 id="ttl">NoTore</h1>
      <div class="sub" id="sub">脳のトレーニング</div>
    </div>
    <div class="spacer"></div>
  </div>

  <!-- ============ HOME ============ -->
  <section class="screen on" id="home">
    <div class="scroll stack" id="homeList"></div>
    <div class="ver" id="appVer"></div>
  </section>

  <!-- ============ TRAINING SETTINGS ============ -->
  <section class="screen" id="hub">
    <div class="scroll">
      <div id="hubTop"></div>
      <div class="card pad quick">
        <div class="qk">おまかせ</div>
        <h2 class="qt">設定なしではじめる</h2>
        <p class="qp" id="quickDesc"></p>
        <div id="quickExtra"></div>
        <button class="btn" id="quickStart">トレーニング開始</button>
      </div>
      <div class="seclbl">自分で設定する</div>
      <div id="hubCustom"></div>
    </div>
    <div class="foot">
      <button class="btn sub" id="customStart">この設定ではじめる</button>
    </div>
  </section>

  <!-- ============ STAGE BREAK ============ -->
  <section class="screen" id="playBreak">
    <div class="stage brkstage">
      <div class="brk">
        <div class="brk-k">ステージ <span class="tnum" id="bkNow">1</span> / <span class="tnum" id="bkAll">5</span> 完了</div>
        <div class="dots" id="bkDots"></div>
        <div class="brk-num tnum" id="bkNum">15</div>
        <div class="brk-lab">レスト — 次はもう少し難しくなります</div>
      </div>
    </div>
    <div class="foot"><button class="btn" id="bkSkip">すぐに次へ</button></div>
  </section>

  <!-- ============ PLAY: ARROW ============ -->
  <section class="screen" id="playArrow">
    <div class="stage">
      <div class="hud">
        <span><span id="aSetLbl">セット</span> <b id="aSet">1/1</b></span>
        <span>残り <b class="tnum" id="aClock">30</b>s</span>
        <span>回数 <b class="tnum" id="aCount">0</b></span>
      </div>
      <div class="field" id="aField">
        <div class="tag" id="aTag"></div>
        <div id="aArrow"></div>
        <div class="veil" id="aVeil" style="display:none"></div>
      </div>
    </div>
  </section>

  <!-- ============ PLAY: NUMBER ============ -->
  <section class="screen" id="playNum">
    <div class="stage">
      <div class="hud">
        <span>問 <b class="tnum" id="nProg">1/5</b></span>
        <span id="nMode"></span>
        <span>正答 <b class="tnum" id="nHits">0</b></span>
      </div>
      <div class="field" id="nField"></div>
      <div class="below" id="nBelow"></div>
    </div>
  </section>

  <!-- ============ PLAY: STROOP (tempo) ============ -->
  <section class="screen" id="playStroop">
    <div class="stage">
      <div class="hud">
        <span><span id="sSetLbl">セット</span> <b id="sSet">1/1</b></span>
        <span>残り <b class="tnum" id="sClock">30</b>s</span>
        <span>回数 <b class="tnum" id="sCount">0</b></span>
      </div>
      <div class="field light" id="sField">
        <div class="tag" id="sTag"></div>
        <div class="word" id="sWord"></div>
        <div class="veil" id="sVeil" style="display:none"></div>
      </div>
    </div>
  </section>

  <!-- ============ PLAY: STROOP VOICE ============ -->
  <section class="screen" id="playVoice">
    <div class="stage">
      <div class="hud">
        <span>問 <b class="tnum" id="vProg">1/10</b></span>
        <span id="vRule"></span>
        <span>正答 <b class="tnum" id="vHits">0</b></span>
      </div>
      <div class="field light" id="vField">
        <div class="tag" id="vTag"></div>
        <div class="word" id="vWord"></div>
        <div class="veil" id="vVeil" style="display:none"></div>
      </div>
      <div class="vstat" id="vStat"></div>
      <button class="btn quiet" id="vSkip">スキップ</button>
    </div>
  </section>

  <!-- ============ PLAY: STROOP GRID ============ -->
  <section class="screen" id="playGrid">
    <div class="stage">
      <div class="hud">
        <span id="gRule"></span>
        <span>経過 <b class="tnum" id="gClock">0.0</b>s</span>
        <span></span>
      </div>
      <div class="field light" id="gField">
        <div class="tag" id="gTag"></div>
        <div class="gridwrap" id="gWrap"></div>
        <div class="veil" id="gVeil" style="display:none"></div>
      </div>
      <button class="btn" id="gDone" style="margin-top:var(--s3)">読み終わった</button>
    </div>
  </section>

  <!-- ============ PLAY: HANDS ============ -->
  <section class="screen" id="playHands">
    <div class="stage">
      <div class="hud">
        <span><span id="hSetLbl">セット</span> <b id="hSet">1/1</b></span>
        <span>残り <b class="tnum" id="hClock">30</b>s</span>
        <span>回数 <b class="tnum" id="hCount">0</b></span>
      </div>
      <div class="field" id="hField">
        <div class="tag">同じ形を両手で</div>
        <div class="hands">
          <div class="hcol"><div class="hl">左手</div><div class="hbox" id="hL"></div><div class="hname" id="hLn"></div></div>
          <div class="hcol"><div class="hl">右手</div><div class="hbox" id="hR"></div><div class="hname" id="hRn"></div></div>
        </div>
        <div class="veil" id="hVeil" style="display:none"></div>
      </div>
    </div>
  </section>

  <!-- ============ PLAY: CARD FLASH ============ -->
  <section class="screen" id="playCard">
    <div class="stage">
      <div class="hud">
        <span>残り <b class="tnum" id="cLeft">60</b>s</span>
        <span id="cIvLbl"></span>
        <span>枚数 <b class="tnum" id="cCount">0</b></span>
      </div>
      <div class="field" id="cField">
        <div class="ccard" id="cCard"></div>
        <div class="fnum tnum" id="cNumOnly"></div>
        <div class="veil" id="cVeil" style="display:none"></div>
      </div>
    </div>
    <!-- カラー：画面いっぱいに色だけを出す -->
    <div class="fwall" id="cWall" style="display:none">
      <button class="fwall-x" id="cWallX" aria-label="やめる">×</button>
      <div class="fwall-hud"><span>残り <b class="tnum" id="cWallLeft">60</b>s</span><span><b class="tnum" id="cWallCount">0</b>枚</span></div>
    </div>
  </section>

  <!-- ============ PLAY: MEMORY GRID ============ -->
  <section class="screen" id="playMem">
    <div class="stage">
      <div class="hud">
        <span>問 <b class="tnum" id="wProg">1/10</b></span>
        <span>数字 <b class="tnum" id="wCnt">5</b>個</span>
        <span>正解 <b class="tnum" id="wHits">0</b></span>
      </div>
      <div class="field" id="wField">
        <div class="tag" id="wTag"></div>
        <div class="mgrid" id="wGrid"></div>
        <div class="veil" id="wVeil" style="display:none"></div>
      </div>
      <div class="below"><div class="rem" id="wMsg"></div></div>
    </div>
  </section>

  <!-- ============ PLAY: BREATH ============ -->
  <section class="screen" id="playBreath">
    <div class="stage">
      <div class="hud">
        <span>残り <b class="tnum" id="bLeft">5:00</b></span>
        <span>リズム <b class="tnum" id="bPatLbl">8-8-8</b></span>
        <span>呼吸 <b class="tnum" id="bCycles">0</b>回</span>
      </div>
      <div class="field" id="bField">
        <div class="bwrap">
          <div class="bub" id="bBub"></div>
          <div class="btext"><div class="bphase" id="bPhase"></div><div class="bnum tnum" id="bNum"></div></div>
        </div>
        <div class="veil" id="bVeil" style="display:none"></div>
      </div>
      <div class="below"><div class="rem" id="bNext"></div></div>
      <button class="btn quiet" id="bStop" style="margin-top:var(--s3)">終える</button>
    </div>
  </section>

  <!-- ============ PLAY: RHYTHM EXERCISE ============ -->
  <section class="screen" id="playMove">
    <div class="stage">
      <div class="hud">
        <span>ラウンド <b class="tnum" id="mRound">1/5</b></span>
        <span>残り <b class="tnum" id="mClock">30</b>s</span>
        <span id="mModeLbl"></span>
      </div>
      <div class="field" id="mField">
        <div class="mv">
          <div class="mv-ex" id="mEx"></div>
          <div class="mv-d" id="mDesc"></div>
          <div class="pulse" id="mPulse"><div class="pulse-in"><b class="tnum" id="mBig">—</b><span id="mUnit"></span></div></div>
          <div class="beats" id="mDots"></div>
          <div class="mv-beat" id="mBeatTxt"></div>
          <div class="mv-dir" id="mDir"></div>
        </div>
        <div class="veil" id="mVeil" style="display:none"></div>
      </div>
      <div class="below"><div class="rem" id="mNext"></div></div>
      <button class="btn quiet" id="mSkip" style="margin-top:var(--s3)">次へ</button>
    </div>
  </section>

  <!-- ============ RESULTS ============ -->
  <section class="screen" id="results">
    <div class="scroll">
      <div class="card">
        <div class="verdict" id="verdict"></div>
        <div class="grid2" id="stats"></div>
        <div class="qlist" id="qlist"></div>
      </div>
    </div>
    <div class="foot">
      <div class="btnrow">
        <button class="btn sub" id="rHome">ホーム</button>
        <button class="btn" id="rAgain">もう一度</button>
      </div>
    </div>
  </section>

</div>

<!-- ============ 丸タッチ（プロジェクター）：画面いっぱいの黒に丸だけを出す ============ -->
<div class="spotwall" id="sWall" style="display:none">
  <div class="spotrot" id="sRot">
    <div class="spotbox" id="sBox"></div>
    <div class="spot-cd tnum" id="sCd"></div>
    <div class="spot-hud tnum" id="sHud"></div>
  </div>
  <div class="spot-ctl" id="sCtl" style="display:none">
    <button class="btn quiet" id="sPause">Ⅱ 一時停止</button><button class="btn" id="sStop">やめる</button>
  </div>
  <div class="spot-cal card pad" id="sCalPanel" style="display:none"></div>
</div>

<script>
"use strict";

/* ============================================================
   Icons (inline SVG, single grid, uniform stroke)
   ============================================================ */
const svg=(p,vb)=>`<svg viewBox="${vb||'0 0 24 24'}" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const ICON={
  arrow : svg('<path d="M12 4v16M4 12h16"/><path d="M12 4l-3.2 3.2M12 4l3.2 3.2M12 20l-3.2-3.2M12 20l3.2-3.2M4 12l3.2-3.2M4 12l3.2 3.2M20 12l-3.2-3.2M20 12l-3.2 3.2"/>'),
  timer : svg('<path d="M9.5 2.75h5"/><circle cx="12" cy="13.5" r="7.75"/><path d="M12 13.5V9.75"/>'),
  color : svg('<circle cx="9.25" cy="12" r="6.25"/><circle cx="14.75" cy="12" r="6.25"/>'),
  chev  : svg('<path d="M9 5l7 7-7 7"/>'),
  back  : svg('<path d="M15 5l-7 7 7 7"/>'),
  check : svg('<path d="M20 6.5L9.5 17 4 11.5"/>'),
  cross : svg('<path d="M6 6l12 12M18 6L6 18"/>'),
  mic   : svg('<rect x="9" y="2.75" width="6" height="11" rx="3"/><path d="M4.75 11.5a7.25 7.25 0 0 0 14.5 0"/><path d="M12 18.75V21.5"/>'),
  dash  : svg('<path d="M6 12h12"/>'),
  hand  : svg('<path d="M8 12.5V6.25a1.5 1.5 0 0 1 3 0V11"/><path d="M11 10.5V4.75a1.5 1.5 0 0 1 3 0V11"/><path d="M14 10.75V6.25a1.5 1.5 0 0 1 3 0v7.5a7 7 0 0 1-7 7h-.5a6 6 0 0 1-4.6-2.2L3.6 15.5a1.4 1.4 0 0 1 2.1-1.85L8 15.5"/>'),
  target: svg('<circle cx="6.5" cy="7" r="3.25"/><circle cx="17.5" cy="7" r="3.25"/><circle cx="12" cy="17" r="3.25"/>'),
  spade : svg('<path d="M12 3.5c1.6 3 6.5 5.6 6.5 9.4a3.2 3.2 0 0 1-5.6 2.1c.2 1.9.9 3.2 2.4 4.5H8.7c1.5-1.3 2.2-2.6 2.4-4.5a3.2 3.2 0 0 1-5.6-2.1c0-3.8 4.9-6.4 6.5-9.4z"/>'),
  grid  : svg('<rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/><path d="M15.6 5.2l1.4-1v6.3"/><path d="M5.2 15.2a1.9 1.9 0 0 1 3.6.8c0 1.3-3.7 3.3-3.7 4.5h3.9"/>'),
  wind  : svg('<path d="M3 8.5h10.5a3 3 0 1 0-3-3"/><path d="M3 12.5h15a3 3 0 1 1-3 3"/><path d="M3 16.5h6"/>'),
  metro : svg('<path d="M9.5 3h5l4 18h-13z"/><path d="M7 16.5h10"/><path d="M12 16.5l4.5-9.5"/>')
};
// big arrow used as the stimulus
const BIG_ARROW = `<svg class="arrow" id="aSvg" viewBox="0 0 100 100" fill="none" stroke="currentColor"
  stroke-width="11" stroke-linecap="round" stroke-linejoin="round"><path d="M50 87V21"/><path d="M27 43L50 19l23 24"/></svg>`;

/* ============================================================
   Data
   ============================================================ */
const DIRS4=['up','right','down','left'];
const DIRS8=['up','upright','right','downright','down','downleft','left','upleft'];
const ANGLE={up:0,upright:45,right:90,downright:135,down:180,downleft:225,left:270,upleft:315};

// warm = go (same direction), cool = anti (opposite)

  const s=(t||'').toLowerCase().replace(/\s/g,'');
  for(let i=0;i<SPOKEN.length;i++) if(SPOKEN[i].some(f=>s.includes(f.toLowerCase()))) return i;

}

/* ============================================================
   Auto program — no setup, gets harder as it goes
   ============================================================ */
let PROG=null;
function stopProg(){ if(PROG){ clearInterval(PROG.bkTick); PROG=null; } }
const rnd=n=>Math.random()*n|0;

// 方向：同じ方向 → 反対 → 色で判断／4→8方向／1.2→1.0秒
function buildArrowProgram(){
  const N=5+rnd(4);                      // 5–8 stages
  let nSame=1+rnd(2), nAnti=2+rnd(2);
  while(nSame+nAnti>N-2){ if(nAnti>1) nAnti--; else nSame--; }   // leave ≥2 color stages
  const dirSwitch=1+rnd(Math.max(1,nSame+nAnti));                // when 8-way kicks in
  const stages=[];
  for(let i=0;i<N;i++){
    const p=N>1?i/(N-1):1;
    const rule=i<nSame?'same':i<nSame+nAnti?'anti':'color';
    let cols=2;
    if(rule==='color'){
      const ci=i-(nSame+nAnti), cn=N-(nSame+nAnti), q=cn>1?ci/(cn-1):1;
      cols=q<0.34?2:q<0.7?4:6;
    }
    stages.push({rule, dirs:i>=dirSwitch?8:4, cols,
                 iv:+(1.2-0.2*p).toFixed(1), dur:30, sets:1});
  }
  return stages;
}
// ストループ：かな → 漢字 → English／1文字ずつ → 一覧（20→30字）／背景なし → ライン・マス
function buildStroopProgram(){
  const N=4+rnd(3);                       // 4–6 stages
  const singles=Math.max(1,Math.round(N*0.4));
  const stages=[];
  for(let i=0;i<N;i++){
    const sc=['kana','kanji','en'][Math.min(2,Math.floor(i/(N/3)))];
    const rule=Math.random()<0.5?'read':'color';
    if(i<singles) stages.push({form:'single', sc, rule, iv:1.5, dur:30, sets:1});
    else{
      const g=(i-singles)/Math.max(1,N-singles-1);   // 0→1 across grid stages
      stages.push({form:'grid', sc, rule, count:g<0.5?20:30,
                   bg:g<0.34?'none':(Math.random()<0.5?'line':'cell')});
    }
  }
  return stages;
}
// 数字：8桁→10桁で通常、後半は逆唱（桁を落として再スタート）。全10問
function buildNumPlan(){
  const total=10, nNormal=5+rnd(2), plan=[];
  const digAt=q=>q<0.34?8:q<0.7?9:10;
  for(let i=0;i<total;i++){
    if(i<nNormal) plan.push({dig:digAt(nNormal>1?i/(nNormal-1):1), t:5, rev:false});
    else{
      const j=i-nNormal, m=total-nNormal;
      plan.push({dig:digAt(m>1?j/(m-1):1), t:j===0?6:5, rev:true});
    }
  }
  return plan;
}

function startAuto(t){
  stopAll(); stopProg();
  if(t==='num'){ runNum({auto:true, total:10, plan:buildNumPlan()}); return; }
  if(t==='move'){ runMove(moveAutoCfg()); return; }
  if(t==='spot'){ runSpot(spotAutoCfg()); return; }
  if(t==='card'){ runCard(flashAutoCfg(flashKindPref())); return; }
  if(t==='mem'){ runMem({auto:true,count:4,grid:'m',after:segVal('wAfterQ')||memAfterPref(),total:10}); return; }
  if(t==='breath'){ runBreath({min:5,out:8,hold:8,in:8,count:'up',snd:'clock',minute:true}); return; }
  PROG={type:t, stages:t==='arrow'?buildArrowProgram():t==='hands'?buildHandsProgram():buildStroopProgram(),
        i:0, count:0, secs:0, bkTick:null};
  progStage();
}
function progStage(){
  const st=PROG.stages[PROG.i];
  if(PROG.type==='arrow') runArrow(st);
  else if(PROG.type==='hands') runHands(st);
  else if(st.form==='grid') runGrid(st);
  else runStroop(st);
  progLabel();
}
function progLabel(){
  const n=PROG.i+1, N=PROG.stages.length;
  $('sub').textContent=`ステージ ${n} / ${N}`;
  if(PROG.type==='arrow'){ $('aSetLbl').textContent='ステージ'; $('aSet').textContent=`${n}/${N}`; }
  else if(PROG.type==='hands'){ $('hSetLbl').textContent='ステージ'; $('hSet').textContent=`${n}/${N}`; }
  else { $('sSetLbl').textContent='ステージ'; $('sSet').textContent=`${n}/${N}`; }
}
function progAdvance(add){
  if(!PROG) return false;
  PROG.count+=add.count||0; PROG.secs+=add.secs||0;
  PROG.i++;
  if(PROG.i>=PROG.stages.length){ progFinish(); return true; }
  progBreak(); return true;
}
function progBreak(){
  const N=PROG.stages.length;
  $('bkNow').textContent=PROG.i; $('bkAll').textContent=N;
  $('bkDots').innerHTML=Array.from({length:N},(_,k)=>`<i class="${k<PROG.i?'on':''}"></i>`).join('');
  let r=15; $('bkNum').textContent=r;
  show('playBreak','休憩',`ステージ ${PROG.i+1} / ${N} へ`);
  PROG.bkTick=setInterval(()=>{
    r--; $('bkNum').textContent=Math.max(0,r);
    if(r<=0){ clearInterval(PROG.bkTick); if(PROG) progStage(); }
  },1000);
}
$('bkSkip').onclick=()=>{ if(!PROG) return; clearInterval(PROG.bkTick); progStage(); };
function progFinish(){
  const p=PROG, N=p.stages.length; PROG=null;
  const stats=[['ステージ',N+'本']];
  if(p.count) stats.push(['こなした回数',p.count+'回']);
  if(p.secs)  stats.push(['読み上げ時間',p.secs.toFixed(1)+'秒']);
  const last=p.stages[N-1];
  stats.push(['最終ステージ', p.type==='hands'
    ? `${last.set==='all'?'いろいろ':'数字だけ'}・${HAND_SPEED_JP[last.spd]}`
    : p.type==='arrow'
    ? (last.rule==='color'?`色で判断・${last.dirs}方向`:last.rule==='anti'?`反対・${last.dirs}方向`:`同じ方向・${last.dirs}方向`)
    : (last.form==='grid'?`一覧${last.count}字${last.bg!=='none'?'・背景':''}`:`1文字ずつ・${SCRIPT_JP[last.sc]}`)]);
  finish({ type:p.type, autoType:p.type, title:'プログラム完了', note:`${N}ステージをやり切りました`, stats });
}

/* ---------- custom panels ---------- */
let cfgUI={}, binds=[];
function seg(name,opts,def,onch){
  const id='sg_'+name;
  const html=`<div class="seg" id="${id}">`+opts.map(o=>`<button data-v="${o.v}"${o.v==def?' class="on"':''}>${o.l}</button>`).join('')+`</div>`;
  binds.push(()=>{
    const c=$(id); if(!c) return;
    c.querySelectorAll('button').forEach(b=>b.onclick=()=>{
      c.querySelectorAll('button').forEach(x=>x.classList.remove('on'));
      b.classList.add('on'); cfgUI[name]=b.dataset.v; onch&&onch(b.dataset.v);
    });
  });
  cfgUI[name]=String(def);
  return html;
}
const segVal=n=>cfgUI[n];
function rowSeg(label,name,opts,def,onch){ return `<div class="row"><span class="lbl">${label}</span>${seg(name,opts,def,onch)}</div>`; }
function rowRange(label,id,min,max,step,def,fmt){
  binds.push(()=>{ const r=$(id); if(r) r.oninput=()=>{ $(id+'V').textContent=fmt?fmt(r.value):r.value; }; });
  return `<div class="row" style="border-bottom:none;padding-bottom:2px"><span class="lbl">${label}</span><span class="val"><span id="${id}V">${fmt?fmt(def):def}</span></span></div>
          <div style="padding-bottom:var(--s3);border-bottom:1px solid var(--line)"><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${def}"></div>`;
}
function rowToggle(label,id,def,onch){
  binds.push(()=>{ const t=$(id); if(t) t.onclick=()=>{ t.classList.toggle('on'); onch&&onch(t.classList.contains('on')); }; });
  return `<div class="row"><span class="lbl">${label}</span><button class="toggle${def?' on':''}" id="${id}"></button></div>`;
}

// multi-select chips (at least one stays on)
function chips(name,opts,defs){
  const id='ch_'+name; defs=defs.map(String);
  cfgUI[name]=defs.slice();
  binds.push(()=>{
    const c=$(id); if(!c) return;
    c.querySelectorAll('button').forEach(b=>b.onclick=()=>{
      const on=!b.classList.contains('on');
      if(!on && c.querySelectorAll('button.on').length<=1) return;
      b.classList.toggle('on',on);
      cfgUI[name]=[...c.querySelectorAll('button.on')].map(x=>x.dataset.v);
    });
  });
  return `<div class="seg" id="${id}">`+opts.map(o=>`<button data-v="${o.v}"${defs.includes(String(o.v))?' class="on"':''}>${o.l}</button>`).join('')+`</div>`;
}

  if(curTrain==='card') runCard({
    kind:segVal('fKind')||flashKindPref(), wallColors:cfgUI.fwColors.slice(), nrange:segVal('fnRange'),
    nchange:cfgUI.fnChange.slice(), ncolors:cfgUI.fnColors.slice(),
    timing:segVal('cTiming'), iv:+segVal('cIv'), rand:segVal('cRand'), change:cfgUI.cChange.slice(),

  });
  if(curTrain==='mem') runMem({
    count:+$('wCount').value, grid:segVal('wGridSel'), after:segVal('wAfterQ')||memAfterPref(), total:+segVal('wQ')
  });
  if(curTrain==='breath'){

  }
  if(curTrain==='hands') runHands({
    set:segVal('hSetSel'), show:segVal('hShow'), spd:segVal('hSpd'), dur:+$('hDur').value, sets:+segVal('hSets'),
    names:$('hNames').classList.contains('on'), beep:$('hBeep').classList.contains('on')
  });

    mode:segVal('mMode'), moves:cfgUI.mMoves.slice(), rounds:+segVal('mRounds'), rest:+segVal('mRest'),
    range:segVal('mRange'), ...(()=>{ const w=moveWideRead(); return {bpmMin:w.min,bpmMax:w.max}; })(), gap:segVal('mGap'), dur:+$('mDur').value, flip:$('mFlip').classList.contains('on'),

    secs:cfgUI.mSecs.map(Number), count:segVal('mCount')
  });

    else
      runStroop({ sc:segVal('sSc'), rule:segVal('sRule'), iv:+$('sIv').value, dur:+$('sDur').value, sets:+segVal('sSets') });
  }
};

/* ============================================================
   Shared: ready countdown
   ============================================================ */
function veilShow(el,html){ el.innerHTML=html; el.style.display='flex'; }
function veilHide(el){ el.style.display='none'; el.innerHTML=''; }
function veilCountdown(el,label,cb){
  let n=3;
  veilShow(el,`<div class="lab">${label}</div><div class="big tnum">${n}</div>`);
  const tk=setInterval(()=>{
    n--; const b=el.querySelector('.big');
    if(n>0){ if(b) b.textContent=n; }
    else{ clearInterval(tk); veilHide(el); cb(); }
  },700);
  return ()=>clearInterval(tk);
}
function veilRest(el,secs,cb){
  let r=secs;
  veilShow(el,`<div class="lab">レスト</div><div class="big tnum">${r}</div><div class="lab">目を閉じて深呼吸</div>`);
  const tk=setInterval(()=>{
    r--; const b=el.querySelector('.big'); if(b) b.textContent=Math.max(0,r);
    if(r<=0){ clearInterval(tk); veilHide(el); cb(); }
  },1000);
  return ()=>clearInterval(tk);
}
// show the rule and wait for the user before counting in
function veilPrepare(el,info,cb){
  let inner=null;
  veilShow(el,`<div class="prep">
      <div class="prep-k">ルール</div>
      <div class="prep-t">${info.title}</div>
      ${info.sub?`<div class="prep-s">${info.sub}</div>`:''}
      ${info.ex||''}
      <button class="btn prep-b" id="prepGo">はじめる</button>
    </div>`);
  el.querySelector('#prepGo').onclick=()=>{ inner=veilCountdown(el,info.title,cb); };
  return ()=>{ if(inner) inner(); };
}

function stroopRuleInfo(cfg){
  const w=0, c=2;                                  // 「赤」を緑インクで
  const ansIdx = cfg.rule==='read' ? w : c;
  const ans = cfg.sc==='en' ? COLORS[ansIdx].e : COLORS[ansIdx].h;
  return {
    title: cfg.rule==='read' ? '文字を読む' : 'インクの色を答える',
    sub: cfg.rule==='read'
      ? 'インクの色は無視して、書かれている単語をそのまま読みます。'
      : '単語の意味は無視して、インクの色を声に出します。',
    ex:`<div class="prep-ex"><span class="w" style="color:${COLORS[c].ink}">${wordOf(w,cfg.sc)}</span>
        <span class="ar">→</span><span class="a">${ans}</span></div>`
  };
}
// small colored arrow used in the rule list
const miniArrow=(color)=>`<svg class="ma" viewBox="0 0 100 100" width="26" height="26" fill="none"
  stroke="${color}" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"><path d="M50 84V26"/><path d="M29 46L50 24l21 22"/></svg>`;
function arrowRuleInfo(cfg,go,anti){
  if(cfg.rule==='color') return {
    title:'色で判断',
    sub:'矢印の色でルールが変わります。色ごとの向きを覚えましょう。',
    ex:`<div class="prep-list">`+
       go.map(x=>`<div class="prep-li">${miniArrow(x.c)}<span><b style="color:${x.c}">${x.n}</b>の矢印</span><span class="act same">同じ方向</span></div>`).join('')+
       anti.map(x=>`<div class="prep-li">${miniArrow(x.c)}<span><b style="color:${x.c}">${x.n}</b>の矢印</span><span class="act opp">反対方向</span></div>`).join('')+
       `</div>`
  };
  const rev = cfg.rule==='anti';
  return {
    title: rev?'反対を向く':'同じ方向を向く',
    sub: rev?'矢印と正反対の方向へ頭を向けます。':'矢印が指す方向へ頭を向けます。',
    ex:`<div class="prep-list"><div class="prep-li">${miniArrow('currentColor')}<span>矢印が出たら</span>
        <span class="act ${rev?'opp':'same'}">${rev?'反対を向く':'同じ方向を向く'}</span></div></div>`
  };
}
function fitText(el,box,maxRatio,availRatio){
  let fs=Math.min(box.clientWidth*(maxRatio||.5),300);
  el.style.fontSize=fs+'px';
  const avail=box.clientWidth*(availRatio||0.84);
  while(el.scrollWidth>avail && fs>20){ fs-=3; el.style.fontSize=fs+'px'; }
}

/* ============================================================
   ARROW engine
   ============================================================ */
let A=null;
function stopArrow(){ if(A){ A.stops.forEach(f=>f&&f()); clearInterval(A.tick); clearInterval(A.clock); clearInterval(A.rest); A=null; } }
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; [a[i],a[j]]=[a[j],a[i]]; } return a; }
function runArrow(cfg){
  stopAll();
  // RANDOMLY choose which colors appear (warm ones and cool ones stay distinct for legibility),
  // then RANDOMLY assign half to「同じ方向」/ half to「反対方向」— all re-rolled every session
  const half=cfg.cols/2;
  const palette=[...shuffle(GO_COLS).slice(0,half), ...shuffle(ANTI_COLS).slice(0,half)];
  const sh=shuffle(palette), idx=c=>palette.indexOf(c);
  const go=sh.slice(0,half).sort((a,b)=>idx(a)-idx(b));
  const anti=sh.slice(half).sort((a,b)=>idx(a)-idx(b));
  A={cfg, go, anti, pool:palette, set:1, count:0, last:null, stops:[]};
  $('aArrow').innerHTML=BIG_ARROW;
  $('aSetLbl').textContent='セット';
  $('aSet').textContent=`1/${cfg.sets}`;
  $('aCount').textContent='0';
  $('aTag').innerHTML = cfg.rule==='color'
    ? go.map(c=>`<span style="color:${c.c}">${c.n}</span>`).join('')+'=そのまま　'+anti.map(c=>`<span style="color:${c.c}">${c.n}</span>`).join('')+'=反対'
    : (cfg.rule==='anti'?'反対を向く':'同じ方向を向く');
  show('playArrow','方向トレーニング', cfg.rule==='color'?'色で判断':cfg.rule==='anti'?'反対を向く':'同じ方向');
  arrowSet(true);
}
function arrowSet(first){
  const c=A.cfg;
  $('aSet').textContent=`${A.set}/${c.sets}`;
  $('aClock').textContent=c.dur;
  const begin=()=>{
    if(!A) return;
    let left=c.dur;
    $('aClock').textContent=left;
    A.clock=setInterval(()=>{
      left--; $('aClock').textContent=Math.max(0,left);
      if(left<=0){ clearInterval(A.clock); clearInterval(A.tick); arrowEnd(); }
    },1000);
    arrowNext();
    A.tick=setInterval(arrowNext, Math.round(c.iv*1000));
  };
  A.stops.push(first
    ? veilPrepare($('aVeil'), arrowRuleInfo(c,A.go,A.anti), begin)
    : veilCountdown($('aVeil'), $('aTag').textContent, begin));
}
function arrowNext(){
  if(!A) return;
  const list=A.cfg.dirs===8?DIRS8:DIRS4;
  let d; do{ d=list[Math.random()*list.length|0]; }while(d===A.last);
  A.last=d; A.count++;
  $('aCount').textContent=A.count;
  const s=$('aSvg'), w=$('aArrow');
  s.style.transform=`rotate(${ANGLE[d]}deg)`;
  s.style.color = A.cfg.rule==='color' ? A.pool[Math.random()*A.pool.length|0].c : '';
  w.classList.remove('pop'); void w.offsetWidth; w.classList.add('pop');
}
function arrowEnd(){
  if(A.set>=A.cfg.sets) return arrowDone();
  A.stops.push(veilRest($('aVeil'),15,()=>{ if(A){ A.set++; arrowSet(false); } }));
}
function arrowDone(){
  const c=A.cfg, n=A.count; stopArrow();
  if(PROG && progAdvance({count:n})) return;
  finish({
    type:'arrow', cfg:c, title:'完了', note:'おつかれさまでした',
    stats:[['こなした回数',n+'回'],['セット',c.sets],['1セット',c.dur+'秒'],['スピード',c.iv.toFixed(1)+'秒']]
  });
}

/* ============================================================
   NUMBER engine
   ============================================================ */
let N=null;
function stopNum(){ if(N){ clearInterval(N.cd); clearInterval(N.sec); clearTimeout(N.to); N=null; } }
function runNum(cfg){
  stopAll();
  N={cfg, q:0, hits:0, log:[], cur:cfg.plan?cfg.plan[0]:cfg};
  $('nHits').textContent='0';
  $('nMode').textContent=N.cur.rev?'逆唱':'通常';
  show('playNum','数字記憶', cfg.auto?'おまかせ 全10問':`${cfg.dig}桁 ・ ${cfg.rev?'逆唱':'通常'}`);
  numNext();
}
function genNum(d){ let s=''+(1+Math.random()*9|0); for(let i=1;i<d;i++) s+=Math.random()*10|0; return s; }
function numNext(){
  if(!N) return;
  if(N.q>=N.cfg.total) return numDone();
  N.q++;
  // per-question difficulty when running the auto program
  N.cur = N.cfg.plan ? N.cfg.plan[N.q-1] : N.cfg;
  $('nMode').textContent=`${N.cur.dig}桁 ・ ${N.cur.rev?'逆唱':'通常'}`;
  $('nProg').textContent=`${N.q}/${N.cfg.total}`;
  $('nBelow').innerHTML='';
  const target=genNum(N.cur.dig);
  let n=3;
  $('nField').innerHTML=`<div class="veil" style="display:flex"><div class="lab">記憶の準備</div><div class="big tnum">${n}</div></div>`;
  N.cd=setInterval(()=>{
    n--;
    if(n>0){ $('nField').querySelector('.big').textContent=n; }
    else{ clearInterval(N.cd); numShow(target); }
  },700);
}
function numShow(target){
  if(!N) return;
  const secs=N.cur.t, R=46, C=2*Math.PI*R;
  $('nField').innerHTML=`<div class="ring">
      <svg viewBox="0 0 100 100"><circle class="track" cx="50" cy="50" r="${R}"></circle>
      <circle class="bar" id="nBar" cx="50" cy="50" r="${R}" stroke-dasharray="${C}" stroke-dashoffset="0"></circle></svg>
      <div class="num tnum" id="nNum">${target}</div></div>`;
  $('nBelow').innerHTML=`<div class="rem" id="nRem">残り <b class="tnum">${secs}</b> 秒</div>`;
  const numEl=$('nNum'); fitText(numEl,$('nField').querySelector('.ring'),.28,.70);
  const bar=$('nBar');
  bar.style.transitionDuration=(secs*1000)+'ms';
  requestAnimationFrame(()=>{ bar.style.strokeDashoffset=C; });
  let s=secs;
  N.sec=setInterval(()=>{
    s--; const r=$('nRem'); if(r){ r.querySelector('b').textContent=Math.max(0,s); if(s<=1) r.classList.add('low'); }
    if(s<=1) bar.style.stroke='var(--ng)';
    if(s<=0) clearInterval(N.sec);
  },1000);
  N.to=setTimeout(()=>{ clearInterval(N.sec); numAsk(target); }, secs*1000);
}
function numAsk(target){
  if(!N) return;
  $('nField').innerHTML=`<div class="numpad" style="padding:0 var(--s5)">
      <div class="lab" style="font-size:14px;color:var(--text-3);margin-bottom:var(--s3)">${N.cur.rev?'逆の順で入力':'そのままの順で入力'}</div>
      <input class="numin tnum" id="nIn" type="text" inputmode="numeric" autocomplete="off" placeholder="- - -"></div>`;
  $('nBelow').innerHTML=`<button class="btn" id="nOk">決定</button>`;
  const inp=$('nIn'); inp.focus();
  const submit=()=>{
    if(!N) return;
    const ans=inp.value.replace(/\D/g,'');
    const exp=N.cur.rev?target.split('').reverse().join(''):target;
    const ok=ans===exp;
    if(ok) N.hits++;
    N.log.push({exp,ans,ok});
    $('nHits').textContent=N.hits;
    $('nField').innerHTML=`<div class="veil" style="display:flex">
        <div class="mark" style="color:var(--${ok?'ok':'ng'})">${ok?ICON.check:ICON.cross}</div>
        <div class="ans tnum">${exp}</div>
        ${ok?'':`<div class="said">あなた：${ans||'—'}</div>`}</div>`;
    $('nBelow').innerHTML='';
    N.to=setTimeout(()=>{ if(N) numNext(); }, ok?800:1500);
  };
  $('nOk').onclick=submit;
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); submit(); } });
}
function numDone(){
  const c=N.cfg, hits=N.hits, log=N.log.slice(); stopNum();
  const acc=Math.round(hits/c.total*100);
  if(c.auto){
    const revHits=log.filter((l,i)=>c.plan[i].rev&&l.ok).length;
    const maxDig=Math.max(...c.plan.map(p=>p.dig));
    finish({
      type:'num', autoType:'num',
      celebrate:{hits, total:c.total,
        tier: hits===c.total?'perfect':hits>=Math.ceil(c.total*0.8)?'good':'',
        title: hits===c.total?'パーフェクト':hits>=Math.ceil(c.total*0.8)?'クリア':'コンプリート',
        note: hits===c.total?'全10問すべて正解。文句なしです。'
             :hits>=Math.ceil(c.total*0.8)?'高い正答率でやり切りました。'
             :'全10問やり切りました。次はもう一歩。'},
      stats:[['正答率',acc+'%'],['正答数',hits+'/'+c.total],
             ['最大の桁数',maxDig+'桁'],['逆唱の正答',revHits+'問']],
      log
    });
    return;
  }
  finish({
    type:'num', cfg:c, title:'完了', note:'おつかれさまでした',
    stats:[['正答率',acc+'%'],['正答数',hits+'/'+c.total],['桁数',c.dig+'桁'],['モード',c.rev?'逆唱':'通常']],
    log
  });
}

/* ============================================================
   STROOP engine (tempo)
   ============================================================ */
let S=null;
function stopStroop(){ if(S){ S.stops.forEach(f=>f&&f()); clearInterval(S.tick); clearInterval(S.clock); clearInterval(S.rest); S=null; } }
function runStroop(cfg){
  stopAll();
  S={cfg,set:1,count:0,last:null,stops:[]};
  $('sSetLbl').textContent='セット';
  $('sSet').textContent=`1/${cfg.sets}`;
  $('sCount').textContent='0';
  $('sTag').textContent = cfg.rule==='read'?'文字を読む':'インクの色を答える';
  $('sWord').textContent='';
  show('playStroop','ストループ', `${SCRIPT_JP[cfg.sc]} ・ ${cfg.rule==='read'?'文字を読む':'色を答える'}`);
  stroopSet(true);
}
function stroopSet(first){
  const c=S.cfg;
  $('sSet').textContent=`${S.set}/${c.sets}`;
  $('sClock').textContent=c.dur;
  const begin=()=>{
    if(!S) return;
    let left=c.dur; $('sClock').textContent=left;
    S.clock=setInterval(()=>{
      left--; $('sClock').textContent=Math.max(0,left);
      if(left<=0){ clearInterval(S.clock); clearInterval(S.tick); stroopEnd(); }
    },1000);
    stroopNext();
    S.tick=setInterval(stroopNext, Math.round(c.iv*1000));
  };
  S.stops.push(first
    ? veilPrepare($('sVeil'), stroopRuleInfo(c), begin)
    : veilCountdown($('sVeil'), $('sTag').textContent, begin));
}
function stroopNext(){
  if(!S) return;
  let w,c,k;
  do{ w=Math.random()*COLORS.length|0; c=Math.random()*COLORS.length|0; k=w+'-'+c; }while(k===S.last);
  S.last=k; S.count++;
  $('sCount').textContent=S.count;
  const el=$('sWord');
  el.textContent=wordOf(w,S.cfg.sc);
  el.style.color=COLORS[c].ink;
  fitText(el,$('sField'),.42);
  el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
}
function stroopEnd(){
  if(S.set>=S.cfg.sets) return stroopDone();
  $('sWord').textContent='';
  S.stops.push(veilRest($('sVeil'),15,()=>{ if(S){ S.set++; stroopSet(false); } }));
}
function stroopDone(){
  const c=S.cfg,n=S.count; stopStroop();
  if(PROG && progAdvance({count:n})) return;
  finish({
    type:'stroop', cfg:c, title:'完了', note:'おつかれさまでした',
    stats:[['こなした回数',n+'回'],['ルール',c.rule==='read'?'文字を読む':'色を答える'],
           ['文字',SCRIPT_JP[c.sc]],['スピード',c.iv.toFixed(1)+'秒']]
  });
}

/* ============================================================
   STROOP voice (β)
   ============================================================ */
let V=null, rec=null;
function stopVoice(){
  if(rec){ rec.onend=null; rec.onresult=null; rec.onerror=null; try{rec.stop();}catch(e){} rec=null; }
  if(V){ clearTimeout(V.to); if(V.stop) V.stop(); V=null; }
}
function vStat(html){ $('vStat').innerHTML=html; }
function runVoice(cfg){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  stopAll();
  if(!SR){ alert('このブラウザは音声認識に対応していません。Chrome 系のブラウザでお試しください。'); return; }
  V={cfg,q:0,hits:0,lock:true,w:0,c:0,last:null,end:false,log:[]};
  $('vHits').textContent='0';
  $('vProg').textContent=`1/${cfg.total}`;
  $('vRule').textContent = cfg.rule==='read'?'文字を読む':'色を答える';
  $('vTag').textContent  = cfg.rule==='read'?'文字を読む':'インクの色を答える';
  show('playVoice','ストループ（音声）', `${SCRIPT_JP[cfg.sc]} ・ ${cfg.rule==='read'?'文字を読む':'色を答える'}`);
  vStat(ICON.mic+'<span>マイクを準備しています…</span>');
  rec=new SR(); rec.lang='ja-JP'; rec.continuous=true; rec.interimResults=true;
  rec.onresult=e=>{
    if(!V) return;
    const t=e.results[e.results.length-1][0].transcript;
    if(!V.lock) vStat(ICON.mic+`<b>${t}</b>`);
    const i=detectColor(t);
    if(i>=0 && !V.lock) vJudge(i,t.trim());
  };
  rec.onerror=e=>{
    if(e.error==='not-allowed'||e.error==='service-not-allowed')
      vStat('<span>マイクが使えません。localhost 経由で開き、マイクを許可してください。</span>');
    else if(e.error==='network') vStat('<span>通信エラー（音声認識には接続が必要です）</span>');
  };
  rec.onend=()=>{ if(V&&!V.end){ try{rec.start();}catch(e){} } };
  try{ rec.start(); }catch(e){}
  V.stop=veilPrepare($('vVeil'), stroopRuleInfo(cfg), ()=>{ if(V) vNext(); });
}
function vNext(){
  if(!V) return;
  if(V.q>=V.cfg.total) return vDone();
  V.q++;
  veilHide($('vVeil'));
  let w,c,k; do{ w=Math.random()*COLORS.length|0; c=Math.random()*COLORS.length|0; k=w+'-'+c; }while(k===V.last);
  V.last=k; V.w=w; V.c=c;
  const el=$('vWord');
  el.textContent=wordOf(w,V.cfg.sc); el.style.color=COLORS[c].ink;
  fitText(el,$('vField'),.42);
  el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
  $('vProg').textContent=`${V.q}/${V.cfg.total}`;
  vStat(ICON.mic+'<span>声で答えてください</span>');
  V.lock=false;
}
function vFeedback(state,ansTxt,saidTxt){   // state: true / false / null(skip)
  const col = state===null?'text-3':state?'ok':'ng';
  const ico = state===null?ICON.dash:state?ICON.check:ICON.cross;
  veilShow($('vVeil'),`<div class="mark" style="color:var(--${col})">${ico}</div>
    <div class="ans">${ansTxt}</div>${saidTxt?`<div class="said">${saidTxt}</div>`:''}`);
  vStat('');
}
function vJudge(said,txt){
  if(!V||V.lock) return;
  V.lock=true;
  const exp = V.cfg.rule==='read'?V.w:V.c;
  const ok = said===exp;
  if(ok) V.hits++;
  V.log.push({exp:COLORS[exp].h,ans:txt,ok});
  $('vHits').textContent=V.hits;
  vFeedback(ok, ok?'正解':'正解：'+COLORS[exp].h, txt?'あなた：'+txt:'');
  V.to=setTimeout(()=>{ if(V) vNext(); }, ok?800:1500);
}
$('vSkip').onclick=()=>{
  if(!V||V.lock) return;
  V.lock=true;
  const exp=V.cfg.rule==='read'?V.w:V.c;
  V.log.push({exp:COLORS[exp].h,ans:'',ok:false});
  vFeedback(null,'正解：'+COLORS[exp].h,'');
  V.to=setTimeout(()=>{ if(V) vNext(); }, 800);
};
function vDone(){
  const c=V.cfg,hits=V.hits,log=V.log.slice(); if(V) V.end=true; stopVoice();
  const acc=Math.round(hits/c.total*100);
  finish({
    type:'voice', cfg:c, title:'完了', note:'おつかれさまでした',
    stats:[['正答率',acc+'%'],['正答数',hits+'/'+c.total],
           ['ルール',c.rule==='read'?'文字を読む':'色を答える'],['文字',SCRIPT_JP[c.sc]]],
    log
  });
}

/* ============================================================
   STROOP grid (read a whole sheet, timed)
   ============================================================ */
let G=null;
function stopGrid(){ if(G){ G.stops.forEach(f=>f&&f()); clearInterval(G.tick); G=null; } }
const BAND_TINTS=['#e4ecff','#fff1d6','#e3f6ea','#ffe7f0','#efe7ff','#e9edf2'];
const CELL_BGS=[
  {n:'緑',bg:'#d3efdb'},{n:'黄',bg:'#fdeeb0'},{n:'桃',bg:'#ffd6e5'},
  {n:'青',bg:'#d3e3ff'},{n:'紫',bg:'#e7dbff'},{n:'橙',bg:'#ffdcc0'}
];
const RULE_LAB={read:'文字を読む',color:'色を答える'};
function runGrid(cfg){
  stopAll();
  G={cfg, words:genWords(cfg), tint:null, band:null, cellCols:null, t0:0, started:false, tick:null, stops:[]};
  if(cfg.bg==='line') G.tint=BAND_TINTS[Math.random()*BAND_TINTS.length|0];
  if(cfg.bg==='cell') setupCellRules(cfg);
  $('gRule').textContent = cfg.rule==='read'?'文字を読む':'色を答える';
  $('gTag').textContent =
    cfg.bg==='line' ? '色つきマスはルールが逆' :
    cfg.bg==='cell' ? '背景の色でルールが変わる' :
    (cfg.rule==='read'?'文字を読む':'インクの色を答える');
  $('gClock').textContent='0.0';
  $('gDone').style.display='none';
  const bgLabel = cfg.bg==='line'?' ・ 背景ライン' : cfg.bg==='cell'?' ・ 背景マス' : '';
  show('playGrid','ストループ 一覧',
    `${SCRIPT_JP[cfg.sc]} ・ ${cfg.rule==='read'?'文字を読む':'色を答える'}${bgLabel}`);
  buildGrid();
  const info = cfg.bg==='cell'?cellRuleInfo(cfg) : cfg.bg==='line'?gridRuleInfo(cfg) : stroopRuleInfo(cfg);
  G.stops.push(veilPrepare($('gVeil'), info, gridStart));
}
// one random background colour = the flipped rule; scatter it onto random cells
function setupCellRules(cfg){
  const col=shuffle(CELL_BGS)[0];
  const other = cfg.rule==='read' ? 'color' : 'read';
  G.cellCols=[{bg:col.bg,name:col.n,rule:other}];
  G.words.forEach(cell=>{ cell.bgi = Math.random()<0.35 ? 0 : -1; });
}
function cellRuleInfo(cfg){
  const rows=[`<div class="prep-li"><span class="cellsw">字</span><span>背景なし</span><span class="act">${RULE_LAB[cfg.rule]}</span></div>`]
    .concat(G.cellCols.map(cc=>`<div class="prep-li"><span class="cellsw" style="background:${cc.bg}">字</span><span>この背景</span><span class="act">${RULE_LAB[cc.rule]}</span></div>`));
  return {
    title:'背景でルールが変わる',
    sub:'マスの背景の色ごとに、読み方が変わります。散らばった背景に注意。',
    ex:`<div class="prep-list">${rows.join('')}</div>`
  };
}
function genWords(cfg){
  const arr=[]; let lw=-1,lc=-1;
  for(let i=0;i<cfg.count;i++){
    let w,c; do{ w=Math.random()*COLORS.length|0; c=Math.random()*COLORS.length|0; }while(w===lw&&c===lc);
    lw=w; lc=c; arr.push({w,c});
  }
  return arr;

// randomly choose row- OR column-bands, and which lines get one
function pickBands(C,R){
  const orient=Math.random()<0.5?'row':'col';
  const n=orient==='row'?R:C;
  const set=new Set();
  for(let i=0;i<n;i++) if(Math.random()<0.45) set.add(i);
  if(set.size===0) set.add(Math.random()*n|0);
  if(set.size>=n) set.delete(Math.random()*n|0);
  return {orient,set,C,R};
}
// pick columns + font so the words fill the white panel (bigger = better)
function computeGridLayout(cfg){
  const wrap=$('gWrap');
  const padX=14, padTop=44, padBot=16, gap=10;
  const innerW=wrap.clientWidth - padX*2;
  const innerH=wrap.clientHeight - padTop - padBot;
  if(innerW<=0||innerH<=0) return null;
  const factor = cfg.sc==='en'?3.6 : cfg.sc==='kana'?4.0 : 1.05;  // widest word ≈ factor×em
  const N=cfg.count;
  let best={f:0,C:1,R:N};
  for(let C=1;C<=N;C++){
    const R=Math.ceil(N/C);
    const cellW=(innerW-(C-1)*gap)/C;
    const cellH=(innerH-(R-1)*gap)/R;
    const f=Math.min(cellW*0.92/factor, cellH*0.72);
    if(f>best.f) best={f,C,R};
  }
  const MINF=20, MAXF=76, fits=best.f>=MINF;
  return {C:best.C, R:best.R, font:Math.max(MINF,Math.min(MAXF,best.f)), fits};
}
function buildGrid(){
  if(!G) return;
  const cfg=G.cfg, wrap=$('gWrap');
  const L=computeGridLayout(cfg); if(!L) return;
  const {C,R,font,fits}=L;
  wrap.style.gridTemplateColumns=`repeat(${C},1fr)`;
  wrap.style.gridTemplateRows  = fits?`repeat(${R},1fr)`:`repeat(${R},minmax(0,auto))`;
  wrap.style.alignContent='stretch';
  wrap.innerHTML='';
  // line bands (row/column) behind the words
  if(cfg.bg==='line'){
    if(!G.band || G.band.C!==C || G.band.R!==R) G.band=pickBands(C,R);
    G.band.set.forEach(idx=>{
      const el=document.createElement('div'); el.className='band'; el.style.background=G.tint;
      if(G.band.orient==='row'){ el.style.gridRow=idx+1; el.style.gridColumn='1 / -1'; }
      else { el.style.gridColumn=idx+1; el.style.gridRow='1 / -1'; }
      wrap.appendChild(el);
    });
  }
  // words (with per-cell scattered backgrounds in 'cell' mode)
  G.words.forEach((cell,i)=>{
    const d=document.createElement('div');
    d.className='gw'; d.style.color=COLORS[cell.c].ink; d.style.fontSize=font+'px';
    d.style.gridColumn=(i%C)+1; d.style.gridRow=Math.floor(i/C)+1;
    d.textContent=wordOf(cell.w,cfg.sc);
    if(cfg.bg==='cell' && cell.bgi>=0){ d.classList.add('cellbg'); d.style.background=G.cellCols[cell.bgi].bg; }
    wrap.appendChild(d);
  });
}

/* ---- sound (Web Audio: scheduled ahead so the beat stays steady) ---- */
const AU={ctx:null,out:null};
function audioOn(){
  try{
    if(!AU.ctx){ const C=window.AudioContext||window.webkitAudioContext; if(!C) return null; AU.ctx=new C(); }
    if(AU.ctx.state!=='running') AU.ctx.resume();
    if(!AU.out){ AU.out=AU.ctx.createGain(); AU.out.connect(AU.ctx.destination); }
    voxDecode();

    const b=AU.ctx.createBuffer(1,1,22050), s=AU.ctx.createBufferSource(); s.buffer=b; s.connect(AU.out); s.start(0);
  }catch(e){ return null; }
  return AU.ctx;
}
// drop everything already queued (used when stopping / skipping)
function audioCut(keep){
  if(AU.out){ try{ AU.out.disconnect(); }catch(e){} AU.out=null; }
  if(keep && AU.ctx){ AU.out=AU.ctx.createGain(); AU.out.connect(AU.ctx.destination); }
}
const now=()=>AU.ctx?AU.ctx.currentTime:0;
function tone(t,f,dur,vol,type){
  if(!AU.ctx||!AU.out) return;
  const c=AU.ctx, o=c.createOscillator(), g=c.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol,t+0.004);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(AU.out); o.start(t); o.stop(t+dur+0.03);
}

function buildMovePlan(cfg){
  let pool=MOVES.filter(m=>cfg.moves.includes(m.k)); if(!pool.length) pool=MOVES.slice(0,2);

      r.dur=s;

      if(cfg.auto){ r.range=metroN===0?'mid':'wide'; r.gap='mid'; r.beatsRand=metroN>=2; }

  const nx=M.plan[M.i+1];
  $('mNext').textContent = nx?`次：${nx.mv.n}`:'最後のラウンド';
  $('mSkip').style.display='none';
  veilShow($('mVeil'),`<div class="lab">ラウンド ${M.i+1} / ${N}</div>
    <div class="mv-intro">${r.mv.n}</div>
    <div class="mv-mode">${r.mode==='sec'?`${r.dur}秒`:`${beatsLabel(r)} ・ ${r.dur}秒`}</div>
    <div class="lab">${r.mode==='sec'?'鳴っているあいだ回し続けます':'1周のあいだは同じテンポ。周の変わり目でテンポが変わります'}</div>
    <div class="big tnum" id="mCd" style="margin-top:8px;min-height:76px"></div>`);
  say(r.mode==='sec'||r.beatsRand?`${r.mv.n}、${r.dur}秒`:`${r.mv.n}、${r.beats}拍で1周`,true);
  [3,2,1].forEach((n,k)=>mLater(()=>{ const e=$('mCd'); if(e) e.textContent=n; SND.count(now()+0.01); },1600+k*1000));
  mLater(()=>{ veilHide($('mVeil')); mGo(r); },1600+3000);
}
function mGo(r){
  mPhase('active');
  if(!audioOn()){ /* no audio: still run visually */ }
  const t0=now()+0.06;
  M.t0=t0; M.tEnd=t0+r.dur;
  $('mSkip').style.display='block'; $('mSkip').textContent='このラウンドを終える';
  if(r.mode==='sec') mGoSec(r,t0); else mGoMetro(r,t0);
  // shared clock: remaining time + ring
  mEvery(()=>{
    const t=now(), left=Math.max(0,M.tEnd-t);
    $('mClock').textContent=Math.ceil(left);
    $('mPulse').style.setProperty('--p',Math.min(1,(t-M.t0)/Math.max(0.1,M.tEnd-M.t0)));
    if(t>=M.tEnd+0.25) mEndRound(false);   // a hair late so the last count shows
  },100);
}
function mGoMetro(r,t0){
  // テンポは「周」の頭でだけ変わる。1周のあいだは同じテンポ・同じ拍数。
  M.bpm=pickBpm(r.range,null,M.cfg); M.nextBeat=t0;
  M.beats=r.beatsRand?pickBeats(null):r.beats; M.beatIdx=0; M.rotN=0; M.rotLeft=gapRand(r.gap); M.metroOver=false;
  M.bpmMin=Math.min(M.bpmMin,M.bpm); M.bpmMax=Math.max(M.bpmMax,M.bpm);
  $('mBig').textContent=M.bpm;
  mEvery(()=>{
    const t=now();
    if(M.nextBeat<t-0.05) M.nextBeat=t+0.03;            // tab was asleep: don't burst
    while(!M.metroOver && M.nextBeat<t+0.12){
      const bt=M.nextBeat; let changed=false;
      if(M.beatIdx===0){                                 // 周の頭
        if(bt>=M.tEnd-0.05){ M.metroOver=true; M.tEnd=bt; break; }   // 周の途中では終わらない
        if(M.rotN>0 && --M.rotLeft<=0){
          M.bpm=pickBpm(r.range,M.bpm,M.cfg); M.changes++; changed=true;
          if(r.beatsRand) M.beats=pickBeats(M.beats);
          M.bpmMin=Math.min(M.bpmMin,M.bpm); M.bpmMax=Math.max(M.bpmMax,M.bpm);
          M.rotLeft=gapRand(r.gap);
          if(M.cfg.flip && Math.random()<0.4) mFlip(bt);
        }
        M.rotN++; M.rots++;
        const rotEnd=bt+M.beats*60/M.bpm;
        if(rotEnd>M.tEnd) M.tEnd=rotEnd;                   // 最後の周は最後まで回す
      }
      const idx=M.beatIdx, beats=M.beats, bpm=M.bpm, rotN=M.rotN;
      beatSound(M.cfg.snd||'click',bt,idx%2===1,idx===0);
      atAudio(bt,()=>{
        const p=$('mPulse'), b=$('mBig'), dots=$('mDots');
        p.classList.remove('hit'); void p.offsetWidth; p.classList.add('hit');
        if(idx===0 || dots.children.length!==beats)
          dots.innerHTML=Array.from({length:beats},()=>'<i></i>').join('');
        [...dots.children].forEach((d,k)=>d.className=k===idx?'on':k<idx?'done':'');
        if(idx===0){
          const bt2=$('mBeatTxt'); bt2.textContent=`${beats}拍で1周 ・ ${rotN}周目`;
          if(changed){ bt2.classList.remove('chg'); void bt2.offsetWidth; bt2.classList.add('chg'); }
          else bt2.classList.remove('chg');
        }
        if(changed){ b.textContent=bpm; b.classList.remove('chg'); void b.offsetWidth; b.classList.add('chg'); }
      });
      M.nextBeat+=60/M.bpm;
      M.beatIdx=(M.beatIdx+1)%M.beats;
    }
  },25);
}
function mFlip(t){
  M.flips++;
  SND.flip(t+0.02);
  atAudio(t,()=>{
    M.dir*=-1;
    const d=$('mDir'); d.textContent = M.dir>0?'↻ 右回り':'↺ 左回り';
    d.classList.remove('flip'); void d.offsetWidth; d.classList.add('flip');
    say('逆回し',true);
  });
}
function mGoSec(r,t0){
  const voice=M.cfg.count==='voice';
  SND.go(t0);
  $('mBig').textContent=0; $('mUnit').textContent=`/ ${r.dur}秒`;
  for(let s=1;s<=r.dur;s++){
    const t=t0+s;
    if(s===r.dur) SND.end(t); else if(r.dur-s<=3) SND.tickHi(t); else SND.tick(t);
    atAudio(t,()=>{
      const p=$('mPulse'); $('mBig').textContent=s;
      p.classList.remove('hit'); void p.offsetWidth; p.classList.add('hit');
      if(voice) say(KANA_NUM[s]||String(s),true);
    });
  }
}
function mEndRound(early){
  const r=M.r, full=Math.max(r.dur,M.tEnd-M.t0), done=early?Math.max(0,Math.min(full,now()-M.t0)):full;
  mPhase('after');
  M.active+=done;
  M.log.push({exp:`${r.mv.n} ・ ${r.mode==='sec'?r.dur+'秒':'メトロノーム '+r.dur+'秒'}`, ok:!early, ans:early?fmtSecs(done)+'で終了':''});
  if(early){ audioCut(true); SND.end(now()+0.02); }
  else if(r.mode==='metro') SND.end(now()+0.02);
  $('mClock').textContent=0; $('mPulse').style.setProperty('--p',1);
  $('mSkip').style.display='none';
  const last=M.i>=M.plan.length-1;
  if(last){ mLater(()=>{ say('おつかれさまでした',true); mDone(); },1100); return; }
  mLater(mRest,900);
}
function mRest(){
  const secs=M.cfg.rest;
  if(!secs){ mIntro(); return; }
  mPhase('rest');
  const nx=M.plan[M.i+1];
  let left=secs;
  veilShow($('mVeil'),`<div class="lab">休憩</div><div class="big tnum" id="mRestN">${left}</div>
    <div class="lab">次は <b>${nx.mv.n}</b>${nx.mode==='sec'?'':'（メトロノーム）'}</div>`);
  say('休憩',true);
  $('mSkip').style.display='block'; $('mSkip').textContent='休憩をとばす';
  mEvery(()=>{
    left--; const e=$('mRestN'); if(e) e.textContent=Math.max(0,left);
    if(left<=0) mIntro();
  },1000);
}
$('mSkip').onclick=()=>{
  if(!M) return;
  if(M.phase==='active') mEndRound(true);
  else if(M.phase==='rest') mIntro();
};
function mDone(){
  const m=M, c=m.cfg; stopMove();
  const stats=[['ラウンド',m.log.length+'本'],['回した時間',fmtSecs(m.active)]];
  if(m.bpmMax>0){ stats.push(['回した周',m.rots+'周']); stats.push(['テンポの変化',m.changes+'回']); stats.push(['テンポ',`${m.bpmMin}〜${m.bpmMax}`]); }
  if(m.flips) stats.push(['逆回し',m.flips+'回']);
  finish({ type:'move', cfg:c, autoType:c.auto?'move':undefined, title:'完了', note:'おつかれさまでした', stats, log:m.log });
}

/* ---- hand illustrations (back of the hand, thumb toward the centre) ---- */
// num:true = 数字のポーズ（設定「数字だけ」で使う）
